<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оплата заказа 2026</title>
    <style>
        html { font-size: 16px; }
        body { 
            font-family: sans-serif; text-align: center; background-color: #000000; color: white;
            margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; 
        }
        .container { 
            width: 380px; 
            height: 600px;
            max-width: 90%; 
            border: 1px solid rgba(255, 255, 255, 0.2); 
            padding: 1.5rem; 
            border-radius: 15px; 
            background: linear-gradient(to bottom, #004d25, #008000, #4CAF50);
            box-shadow: 0 4px 6px rgba(0,0,0,0.5); 
            box-sizing: border-box; 
            display: flex; flex-direction: column; justify-content: center;
        }
        h1 { margin-top: 0; font-size: 1.5rem; } 
        .input-group { margin-bottom: 1.25rem; text-align: left; }
        label { display: block; margin-bottom: 0.5rem; font-weight: bold; font-size: 0.9rem; }
        input { 
            padding: 0.75rem; font-size: 1rem; width: 100%; box-sizing: border-box; 
            border: 1px solid #ddd; border-radius: 5px; background-color: black; 
            color: #00ff41; caret-color: #00ff41;
        }
        
        #payment-input {
            font-size: 2rem; 
            font-weight: 900; 
            text-align: left; 
            color: #00ff41; 
            background-color: #1a1a1a; 
            caret-color: #00ff41;
        }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        
        button { 
            padding: 1rem; font-size: 1rem; border: none; cursor: pointer; width: 100%; 
            font-weight: bold; border-radius: 5px; margin-top: 0.75rem; 
            box-shadow: 0 4px 12px rgba(0, 123, 255, 0.4); transition: all 0.2s ease-in-out;
        }
        .btn-card { background-color: #007bff; color: white; }
        button:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(0, 123, 255, 0.5); }
        button:active { transform: translateY(1px); box-shadow: 0 2px 8px rgba(0, 123, 255, 0.3); }
        
        #status-text { margin-top: 1rem; font-weight: bold; font-size: 0.9rem; }

        .modal {
            display: none; position: fixed; z-index: 1; left: 0; top: 0;
            width: 100%; height: 100%; background-color: rgba(0,0,0,0.9);
            justify-content: center; align-items: center; flex-direction: column;
            color: white; font-size: 1.2rem;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3); border-radius: 50%;
            border-top: 4px solid #00ff41; width: 40px; height: 40px;
            animation: spin 1s linear infinite; margin-bottom: 1rem;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #success-modal .checkmark {
            font-size: 4rem; color: #00ff41; margin-bottom: 1rem;
            opacity: 0; transform: scale(0.5);
            animation: fadeInScale 0.5s ease-out forwards;
        }
        @keyframes fadeInScale {
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Оплата заказа 2026</h1>
        
        <div class="input-group">
            <label for="terminal-id">ID ТЕРМИНАЛА:</label>
            <input type="number" id="terminal-id" placeholder="123456" value="123456">
        </div>

        <div id="manual-pay-section">
            <div class="input-group">
                <label for="payment-input">СУММА ОПЛАТЫ (РУБ):</label>
                <input type="number" id="payment-input" placeholder="0.00" step="0.01" value="100.00">
            </div>
            <button class="btn-card" onclick="handlePaymentClick()">ОПЛАТИТЬ КАРТОЙ</button>
        </div>
        
        <p id="status-text" style="margin-top: 15px; font-weight: bold;">Система готова</p>
    </div>

    <!-- Модальные окна -->
    <div id="loading-modal" class="modal">
        <div class="spinner"></div>
        <p id="loading-text">Обработка платежа...</p>
    </div>

    <div id="success-modal" class="modal">
        <div class="checkmark">✅</div>
        <p>ОПЛАЧЕНО УСПЕШНО!</p>
        <button onclick="hideSuccessModal()" style="margin-top: 2rem; background-color: #00ff41; color: black;">Готово</button>
    </div>

    <script>
        const FIREBASE_BASE_URL = "https://cassa-simulator-4-default-rtdb.firebaseio.com";

        function showLoadingModal(text) {
            document.getElementById('loading-text').innerText = text || 'Обработка платежа...';
            document.getElementById('loading-modal').style.display = 'flex';
        }

        function hideLoadingModal() {
            document.getElementById('loading-modal').style.display = 'none';
        }

        function showSuccessModal() {
            document.getElementById('success-modal').style.display = 'flex';
        }

        function hideSuccessModal() {
            document.getElementById('success-modal').style.display = 'none';
            document.getElementById('payment-input').value = '';
            document.getElementById('status-text').innerText = "Система готова";
            document.getElementById('status-text').style.color = "white";
        }

        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            const terminalIdFromUrl = urlParams.get('id');
            const amountFromUrl = urlParams.get('amount');
            if (terminalIdFromUrl) document.getElementById('terminal-id').value = terminalIdFromUrl;
            if (amountFromUrl) document.getElementById('payment-input').value = amountFromUrl;
        };

        async function handlePaymentClick() {
            const terminalId = document.getElementById('terminal-id').value;
            const userEnteredAmount = parseFloat(document.getElementById('payment-input').value);
            const statusText = document.getElementById('status-text');
            
            // Проверка только ID и суммы
            if (!terminalId || isNaN(userEnteredAmount) || userEnteredAmount <= 0) {
                statusText.style.color = "red";
                statusText.innerText = "Ошибка: Введите ID терминала и сумму.";
                return;
            }
            
            showLoadingModal('Связываюсь с банком...');
            statusText.style.color = "orange";
            statusText.innerText = "Запрос отправлен...";

            try {
                await new Promise(resolve => setTimeout(resolve, 1500)); 
                document.getElementById('loading-text').innerText = 'Передаю запрос на сервер...';
                
                const response = await fetch(`${FIREBASE_BASE_URL}/status/${terminalId}.json`);
                const data = await response.json();
                
                if (!data) { throw new Error("Терминал не найден."); }

                document.getElementById('loading-text').innerText = 'Ответ получен, проверка данных...';
                await new Promise(resolve => setTimeout(resolve, 800));

                const expectedAmount = parseFloat(data.amount);
                const isWaiting = data.state === "WAITING_PAYMENT";
                const amountsMatch = Math.abs(userEnteredAmount - expectedAmount) < 0.01;

                if (isWaiting && !isNaN(expectedAmount) && amountsMatch) {
                    await fetch(`${FIREBASE_BASE_URL}/status/${terminalId}.json`, {
                        method: 'PATCH',
                        body: JSON.stringify({ 
                            state: "SUCCESS", 
                            paidAmount: userEnteredAmount, 
                            lastPaymentType: "card",
                            lastCardDigits: "0000" // Заглушка вместо номера карты
                        })
                    });
                    
                    hideLoadingModal();
                    showSuccessModal(); 
                    statusText.style.color = "#00ff41";
                    statusText.innerText = "✅ Оплата прошла успешно!";

                } else if (!isWaiting) {
                    throw new Error(`Статус терминала: ${data.state}. Ожидание оплаты не активно.`);
                } else if (!amountsMatch) {
                    throw new Error(`Сумма не совпадает. Ожидается: ${expectedAmount} РУБ.`);
                } else {
                    throw new Error("Ошибка верификации данных.");
                }

            } catch (error) {
                statusText.style.color = "red";
                statusText.innerText = "Ошибка: " + error.message;
                hideLoadingModal();
            }
        }
    </script>
</body>
</html>
