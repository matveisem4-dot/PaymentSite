<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>ОНИКС: ПУЛЬТ КАССИРА</title>
    <style>
        body { font-family: 'Arial', sans-serif; background: #000; color: #00ff41; text-align: center; padding: 20px; }
        .panel { border: 2px solid #00ff41; padding: 20px; border-radius: 15px; max-width: 400px; margin: auto; background: #0a0a0a; box-shadow: 0 0 20px rgba(0,255,65,0.2); }
        input { width: 100%; padding: 15px; margin: 10px 0; background: #111; border: 1px solid #00ff41; color: #00ff41; font-size: 20px; border-radius: 5px; text-align: center; }
        .btn-trigger { background: #00ff41; color: #000; border: none; padding: 20px; width: 100%; font-weight: bold; font-size: 18px; border-radius: 5px; cursor: pointer; text-transform: uppercase; }
        .btn-trigger:hover { background: #00cc33; box-shadow: 0 0 15px #00ff41; }
        #log { margin-top: 15px; font-size: 12px; color: #888; }
    </style>
</head>
<body>
    <div class="panel">
        <h1 style="margin-top:0">ONYX CONTROL</h1>
        <label>ID ТЕРМИНАЛА:</label>
        <input type="number" id="tid" placeholder="123456" value="123456">
        
        <label>СУММА:</label>
        <input type="number" id="amt" value="100.00">

        <button class="btn-trigger" onclick="blastTerminal()">ОПЛАТИТЬ УДАЛЕННО</button>
        <div id="log">Ожидание команды...</div>
    </div>

    <script>
        const DB_URL = "https://cassa-simulator-4-default-rtdb.firebaseio.com";

        async function blastTerminal() {
            const id = document.getElementById('tid').value;
            const log = document.getElementById('log');
            
            log.innerText = "Пронзаю систему...";

            try {
                // 1. Сначала говорим терминалу, что пришла оплата
                await fetch(`${DB_URL}/commands/${id}.json`, {
                    method: 'PUT',
                    body: JSON.stringify({ command: "PAY", amount: 100, timestamp: Date.now() })
                });

                // 2. И ТУТ ЖЕ принудительно ставим SUCCESS
                await fetch(`${DB_URL}/status/${id}.json`, {
                    method: 'PATCH',
                    body: JSON.stringify({ state: "SUCCESS", lastUpdate: Date.now() })
                });

                log.style.color = "#00ff41";
                log.innerText = "СИГНАЛ ПРОШЕЛ. ТЕРМИНАЛ ДОЛЖЕН ПРИНЯТЬ ОПЛАТУ.";
            } catch (e) {
                log.style.color = "red";
                log.innerText = "ОШИБКА: " + e.message;
            }
        }
    </script>
</body>
</html>
