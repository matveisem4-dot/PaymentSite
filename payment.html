<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Завершение оплаты</title>
    <style>
        body { background: #000; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { 
            width: 380px; padding: 1.5rem; border-radius: 15px; 
            background: linear-gradient(to bottom, #004d25, #008000, #4CAF50); 
            border: 1px solid rgba(255,255,255,0.2); 
        }
        h1 { margin-top: 0; font-size: 1.5rem; }
        .input-group { margin-bottom: 1.25rem; text-align: left; }
        label { display: block; margin-bottom: 0.5rem; font-weight: bold; color: rgba(255,255,255,0.9); }
        input { 
            padding: 0.75rem; width: 100%; box-sizing: border-box; border-radius: 5px; 
            background: #000; color: #00ff41; border: 1px solid #444; font-size: 1.2rem;
        }
        #payment-input { font-size: 2rem; font-weight: 900; }
        button { padding: 1rem; font-size: 1.1rem; border: none; cursor: pointer; width: 100%; font-weight: bold; border-radius: 5px; margin-top: 1rem; background: #FF5733; color: white; }
        #status-text { margin-top: 1rem; font-weight: bold; min-height: 1.2em; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Сайт оплаты (Мгновенно)</h1>
        <div class="input-group">
            <label>ID ТЕРМИНАЛА:</label>
            <input type="number" id="tid" placeholder="00000" value="12345">
        </div>
        <div class="input-group">
            <label>СУММА К ОПЛАТЕ:</label>
            <input type="number" id="sum" placeholder="0.00" value="100.00">
        </div>
        <button onclick="completePayment()">МГНОВЕННО ОПЛАТИТЬ</button>
        <p id="status-text">Готов к работе</p>
    </div>
    
    <script>
        const DB = "https://cassa-simulator-4-default-rtdb.firebaseio.com";

        async function completePayment() {
            const tid = document.getElementById('tid').value.trim();
            const sumInput = document.getElementById('sum').value.replace(',', '.');
            const sum = parseFloat(sumInput);
            const status = document.getElementById('status-text');

            // ПРОВЕРКА СУММЫ И ID
            if (!tid || tid.length < 4 || isNaN(sum) || sum <= 0) {
                status.innerText = "ОШИБКА: Проверьте ID и сумму (цифрами)!";
                status.style.color = "red";
                return;
            }
            
            const finalAmount = sum.toFixed(2);
            status.innerText = "Отправляю сигнал 'Оплачено'...";
            status.style.color = "orange";

            try {
                // ОТПРАВЛЯЕМ СТАТУС SUCCESS В БАЗУ ДАННЫХ
                await fetch(`${DB}/status/${tid}.json`, {
                    method: 'PUT',
                    body: JSON.stringify({ 
                        state: "SUCCESS", 
                        amount: finalAmount, // Добавляем сумму в подтверждение
                        timestamp: Date.now() 
                    })
                });

                status.innerText = "✅ СИГНАЛ УСПЕХА ОТПРАВЛЕН!";
                status.style.color = "#00ff41";

            } catch (e) {
                status.innerText = "Ошибка сети!";
                status.style.color = "red";
            }
        }
    </script>
</body>
</html>
