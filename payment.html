<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Оплата заказа</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; background-color: #f4f4f4; }
        .container { max-width: 400px; margin: auto; border: 1px solid #ccc; padding: 30px; border-radius: 15px; background: white; shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .input-group { margin-bottom: 20px; text-align: left; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { padding: 12px; font-size: 16px; width: 100%; box-sizing: border-box; border: 1px solid #ddd; border-radius: 5px; }
        button { padding: 15px 20px; font-size: 18px; background-color: #00ff41; color: black; border: none; cursor: pointer; width: 100%; font-weight: bold; border-radius: 5px; }
        button:hover { background-color: #00cc33; }
        .error-msg { color: red; font-size: 14px; margin-top: 5px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Оплата заказа</h1>
        
        <div class="input-group">
            <label for="terminal-id">ID ТЕРМИНАЛА (6 цифр):</label>
            <input type="number" id="terminal-id" placeholder="Напр: 123456">
        </div>

        <div class="input-group">
            <label for="payment-input">СУММА ОПЛАТЫ (РУБ):</label>
            <input type="number" id="payment-input" placeholder="0.00" step="0.01">
        </div>

        <button onclick="handlePaymentClick()">ОПЛАТИТЬ</button>
        <p id="status-text" style="margin-top: 15px; font-weight: bold;"></p>
    </div>

    <script>
        const FIREBASE_BASE_URL = "https://cassa-simulator-4-default-rtdb.firebaseio.com";

        async function handlePaymentClick() {
            const terminalId = document.getElementById('terminal-id').value;
            const userEntered = parseFloat(document.getElementById('payment-input').value);
            const statusText = document.getElementById('status-text');

            if (!terminalId || terminalId.length < 5) {
                alert("Пожалуйста, введите корректный ID терминала.");
                return;
            }

            if (isNaN(userEntered) || userEntered <= 0) {
                alert("Введите корректную сумму оплаты.");
                return;
            }

            try {
                // 1. Получаем требуемую сумму из Firebase для указанного ID
                const response = await fetch(`${FIREBASE_BASE_URL}/status/${terminalId}.json`);
                const data = await response.json();
                
                if (!data || !data.requiredAmount) {
                    statusText.style.color = "red";
                    statusText.innerText = "Ошибка: Терминал с таким ID не найден или не ожидает оплаты.";
                    return;
                }
                
                const requiredAmount = parseFloat(data.requiredAmount);

                // 2. Проверка суммы
                if (userEntered < requiredAmount) {
                    statusText.style.color = "red";
                    statusText.innerText = "Недостаточно средств! Нужно: " + requiredAmount + " руб.";
                } else {
                    // 3. Успех: меняем статус в базе
                    await fetch(`${FIREBASE_BASE_URL}/status/${terminalId}.json`, {
                        method: 'PUT',
                        body: JSON.stringify({ 
                            state: "SUCCESS",
                            paidAmount: userEntered 
                        })
                    });

                    statusText.style.color = "green";
                    statusText.innerText = "✅ Оплата прошла успешно! Терминал скоро обновится.";
                    
                    // Очищаем поля после успешной оплаты
                    document.getElementById('payment-input').value = "";
                }
            } catch (e) {
                console.error(e);
                alert("Ошибка связи с сервером.");
            }
        }
    </script>
</body>
</html>
