<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Процессинг Оплаты</title>
    <style>
        body { background: #121212; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { width: 350px; padding: 20px; border-radius: 15px; background: #1e1e1e; border: 1px solid #333; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; box-sizing: border-box; border-radius: 5px; border: 1px solid #444; background: #000; color: #00ff41; font-size: 1.1rem; }
        button { width: 100%; padding: 15px; border: none; border-radius: 5px; background: #28a745; color: white; font-weight: bold; cursor: pointer; }
        #status { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Оплата 2026</h2>
        <input type="number" id="tid" placeholder="Введите ID терминала">
        <input type="number" id="user-sum" placeholder="Введите сумму">
        <button onclick="checkAndPay()">ОПЛАТИТЬ</button>
        <p id="status">Введите данные</p>
    </div>

    <script>
        const DB = "https://cassa-simulator-4-default-rtdb.firebaseio.com";

        async function checkAndPay() {
            const tid = document.getElementById('tid').value;
            const userSum = parseFloat(document.getElementById('user-sum').value);
            const status = document.getElementById('status');

            if (!tid || isNaN(userSum)) {
                status.innerText = "⚠️ Заполните все поля";
                return;
            }

            status.innerText = "Проверка данных...";
            status.style.color = "white";

            try {
                // 1. Получаем данные терминала из базы
                const r = await fetch(`${DB}/${tid}.json`);
                const data = await r.json();

                if (!data) {
                    status.innerText = "❌ Терминал не найден";
                    status.style.color = "red";
                    return;
                }

                const targetAmount = parseFloat(data.amount);

                // 2. ЖЁСТКАЯ ПРОВЕРКА СУММЫ
                if (userSum < targetAmount) {
                    status.innerText = "❌ НЕДОСТАТОЧНО СРЕДСТВ";
                    status.style.color = "#ff4444";
                } 
                else if (userSum > targetAmount) {
                    status.innerText = "❌ СЛИШКОМ МНОГО ДЕНЕГ";
                    status.style.color = "#ffbb33";
                } 
                else {
                    // 3. СУММА СОВПАЛА — ОТПРАВЛЯЕМ СИГНАЛ УСПЕХА
                    await fetch(`${DB}/${tid}.json`, {
                        method: 'PATCH', // Используем PATCH, чтобы обновить только статус
                        body: JSON.stringify({ status: "SUCCESS" })
                    });
                    status.innerText = "✅ ОПЛАЧЕНО УСПЕШНО!";
                    status.style.color = "#00ff41";
                }

            } catch (e) {
                status.innerText = "Ошибка связи с базой";
            }
        }
    </script>
</body>
</html>
