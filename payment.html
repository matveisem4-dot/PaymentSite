<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Оплата заказа </title>
    <style>
        body { 
            font-family: sans-serif; 
            text-align: center; 
            padding-top: 20px; 
            background: linear-gradient(to bottom, #004d25, #008000, #4CAF50);
            color: white;
            position: relative;
            min-height: 100vh;
        }
        .container { 
            max-width: 400px; 
            margin: auto; 
            border: 1px solid rgba(255, 255, 255, 0.2); 
            padding: 30px; 
            border-radius: 15px; 
            background: rgba(0, 0, 0, 0.4);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); 
        }
        .input-group { margin-bottom: 20px; text-align: left; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        
        input { 
            padding: 12px; font-size: 16px; width: 100%; box-sizing: border-box; 
            border: 1px solid #ddd; border-radius: 5px; background-color: black; 
            color: red; caret-color: red;
        }
        
        button { padding: 15px; font-size: 16px; border: none; cursor: pointer; width: 100%; font-weight: bold; border-radius: 5px; margin-top: 10px; transition: 0.3s; }
        .btn-card { background-color: #007bff; color: white; }
        
        #sberkot-image {
            position: absolute; bottom: 20px; right: 20px; width: 100px; pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Оплата заказа 2025</h1>
        
        <div class="input-group">
            <label for="terminal-id">ID ТЕРМИНАЛА:</label>
            <input type="number" id="terminal-id" placeholder="123456" value="123456">
        </div>

        <div id="manual-pay-section">
            <div class="input-group">
                <label for="payment-input">СУММА ОПЛАТЫ (РУБ):</label>
                <input type="number" id="payment-input" placeholder="0.00" step="0.01" value="100.00">
            </div>
            <button class="btn-card" onclick="handlePaymentClick()">ОПЛАТИТЬ КАРТОЙ</button>
        </div>
        
        <p id="status-text" style="margin-top: 15px; font-weight: bold;">Система готова</p>
    </div>

    <img id="sberkot-image" src="https://free-png.ru/wp-content/uploads/2020/09/icon_sber-01.png" alt="СберКот" />

    <script>
        const FIREBASE_BASE_URL = "https://cassa-simulator-4-default-rtdb.firebaseio.com";

        // Функция задержки (больше не нужна, но оставил на всякий случай)
        function delay(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        async function handlePaymentClick() {
            const terminalId = document.getElementById('terminal-id').value;
            const userEnteredAmount = parseFloat(document.getElementById('payment-input').value);
            const statusText = document.getElementById('status-text');

            if (!terminalId || isNaN(userEnteredAmount) || userEnteredAmount <= 0) {
                statusText.style.color = "red";
                statusText.innerText = "Ошибка: Введите корректные данные.";
                return;
            }
            
            statusText.style.color = "orange";
            statusText.innerText = "Проверка суммы...";

            try {
                // 1. Запрашиваем у Firebase, какую сумму ожидает терминал
                const response = await fetch(`${FIREBASE_BASE_URL}/status/${terminalId}.json`);
                const data = await response.json();
                
                // Проверяем статус терминала и ожидаемую сумму
                const expectedAmount = parseFloat(data?.amount);
                
                if (data.state === "WAITING_PAYMENT" && !isNaN(expectedAmount) && userEnteredAmount === expectedAmount) {
                    // 2. Если суммы совпадают и терминал ждет оплаты - отправляем SUCCESS
                     await fetch(`${FIREBASE_BASE_URL}/status/${terminalId}.json`, {
                        method: 'PATCH',
                        body: JSON.stringify({ state: "SUCCESS", paidAmount: userEnteredAmount, lastPaymentType: "card" })
                    });
                    statusText.style.color = "green";
                    statusText.innerText = "✅ Оплата картой прошла успешно!";

                } else if (userEnteredAmount !== expectedAmount) {
                    // Если суммы не совпадают - отказ
                    statusText.style.color = "red";
                    statusText.innerText = `Ошибка: Сумма не совпадает с терминалом. Ожидается: ${expectedAmount} РУБ.`;

                } else if (data.state !== "WAITING_PAYMENT") {
                    // Если терминал не ждет оплаты
                    statusText.style.color = "red";
                    statusText.innerText = "Ошибка: Терминал сейчас не принимает оплату (статус IDLE/SUCCESS).";
                }

            } catch (error) {
                statusText.style.color = "red";
                statusText.innerText = "Ошибка связи с Firebase: " + error.message;
            }
        }
    </script>       
</body>
</html>
