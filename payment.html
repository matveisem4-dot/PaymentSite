<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Касса Оплаты 2026</title>
    <style>
        body { background: #121212; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .box { width: 350px; padding: 30px; border-radius: 20px; background: #1a1a1a; border: 1px solid #333; text-align: center; }
        input { width: 100%; padding: 15px; margin: 15px 0; box-sizing: border-box; background: #000; border: 1px solid #444; color: #7cec84; font-size: 20px; border-radius: 10px; }
        button { width: 100%; padding: 18px; background: #7cec84; color: #004d25; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 16px; }
        #loading-overlay { display:none; margin-top: 20px; color: #7cec84; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <h2 style="color: #7cec84; margin-top: 0;">КАССА 2026</h2>
        <label>ID ТЕРМИНАЛА:</label>
        <input type="number" id="tid" placeholder="00000">
        <label>СУММА (РУБ):</label>
        <input type="number" id="sum" value="100.00">
        <button onclick="sendPay()">ОТПРАВИТЬ СЧЕТ</button>
        <div id="loading-overlay">Отправка...</div>
        <p id="status" style="margin-top: 20px; color: #888;">Готов к работе</p>
    </div>

    <script>
        const DB = "https://cassa-simulator-4-default-rtdb.firebaseio.com";

        async function sendPay() {
            const tid = document.getElementById('tid').value;
            const sum = document.getElementById('sum').value;
            const loader = document.getElementById('loading-overlay');
            const status = document.getElementById('status');

            if(!tid || !sum) return alert("Введите данные!");

            loader.style.display = "block";
            status.innerText = "Связь с банком...";

            try {
                // ШАГ 1: Показываем процесс
                await new Promise(r => setTimeout(r, 1000));
                loader.innerText = "Ответ получен. Отправка на терминал...";

                // ШАГ 2: Чистим старый статус и шлем команду
                await fetch(`${DB}/status/${tid}.json`, {method:'PUT', body: JSON.stringify({state:'WAITING'})});
                await fetch(`${DB}/commands/${tid}.json`, {
                    method: 'PUT',
                    body: JSON.stringify({ type: "PAY", amount: sum })
                });

                status.innerText = "ОЖИДАНИЕ ОПЛАТЫ НА ТЕРМИНАЛЕ...";
                loader.style.display = "none";

                // ШАГ 3: Ждем SUCCESS от терминала
                const check = setInterval(async () => {
                    const r = await fetch(`${DB}/status/${tid}.json`);
                    const d = await r.json();
                    if(d && d.state === "SUCCESS") {
                        clearInterval(check);
                        status.innerText = "✅ ОПЛАЧЕНО!";
                        status.style.color = "#7cec84";
                        alert("Платеж подтвержден!");
                    }
                }, 2000);

            } catch(e) { 
                alert("Ошибка сети!"); 
                loader.style.display = "none";
            }
        }
    </script>
</body>
</html>
