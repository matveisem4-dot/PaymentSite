<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Оплата заказа 2025</title>
    <style>
        body { 
            font-family: sans-serif; 
            text-align: center; 
            padding-top: 20px; 
            background: linear-gradient(to bottom, #053b1e, #008000);
            color: white;
            min-height: 100vh;
        }
        .container { 
            max-width: 400px; 
            margin: auto; 
            padding: 30px; 
            border-radius: 15px; 
            background: rgba(0, 0, 0, 0.7);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
        }
        input { 
            padding: 12px; font-size: 18px; width: 100%; box-sizing: border-box; 
            border: 2px solid #00ff41; border-radius: 5px; background: #000; 
            color: #00ff41; margin-bottom: 20px; text-align: center;
        }
        button { 
            padding: 15px; font-size: 16px; border: none; cursor: pointer; 
            width: 100%; font-weight: bold; border-radius: 5px; 
            background-color: #00ff41; color: black; transition: 0.3s; 
        }
        button:active { transform: scale(0.95); }
        #status-text { margin-top: 15px; font-weight: bold; color: #aaa; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Оплата заказа</h1>
        
        <label>ID ТЕРМИНАЛА:</label>
        <input type="number" id="terminal-id" placeholder="123456" value="123456">

        <label>СУММА:</label>
        <input type="number" id="payment-amount" value="100.00">

        <button onclick="forcePay()">ОТПРАВИТЬ СИГНАЛ ОПЛАТЫ</button>
        
        <p id="status-text">Готов к отправке</p>
    </div>

    <script>
        const FIREBASE_BASE_URL = "https://cassa-simulator-4-default-rtdb.firebaseio.com";

        async function forcePay() {
            const id = document.getElementById('terminal-id').value;
            const amt = document.getElementById('payment-amount').value;
            const statusText = document.getElementById('status-text');

            if (!id) return alert("Введите ID!");

            statusText.innerText = "Отправка сигнала...";

            try {
                // МЫ ПИШЕМ В /commands/, потому что терминал в setInterval(checkSync)
                // проверяет именно этот путь!
                const response = await fetch(`${FIREBASE_BASE_URL}/commands/${id}.json`, {
                    method: 'PUT',
                    body: JSON.stringify({
                        command: "PAY",
                        amount: parseFloat(amt),
                        timestamp: Date.now()
                    })
                });

                if (response.ok) {
                    statusText.style.color = "#00ff41";
                    statusText.innerText = "СИГНАЛ ОТПРАВЛЕН! Проверь терминал.";
                }
            } catch (error) {
                statusText.innerText = "Ошибка: " + error.message;
            }
        }
    </script>
</body>
</html>
