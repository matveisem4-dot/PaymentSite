<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omega Remote Control</title>
    <style>
        :root { --primary: #00ff88; --bg: #0a0a0f; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card-box { width: 350px; padding: 30px; border-radius: 30px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px); text-align: center; }
        h2 { color: var(--primary); letter-spacing: 2px; margin-bottom: 25px; }
        .info-block { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 15px; margin-bottom: 20px; border-left: 4px solid var(--primary); }
        input { width: 100%; padding: 15px; margin: 10px 0; border-radius: 12px; border: 1px solid #333; background: #000; color: var(--primary); font-size: 18px; text-align: center; outline: none; }
        button { width: 100%; padding: 18px; border-radius: 15px; border: none; background: var(--primary); color: #000; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        button:active { transform: scale(0.98); }
        .status-dot { width: 10px; height: 10px; background: var(--primary); border-radius: 50%; display: inline-block; margin-right: 8px; box-shadow: 0 0 10px var(--primary); }
    </style>
</head>
<body>

    <div class="card-box">
        <h2>OMEGA CONTROL</h2>
        
        <div class="info-block">
            <div style="font-size: 12px; opacity: 0.6;">ТЕРМИНАЛ ID</div>
            <div id="display-id" style="font-weight: bold; font-size: 20px;">------</div>
        </div>

        <div id="order-info" style="margin-bottom: 20px;">
            <div style="font-size: 14px; margin-bottom: 5px;">СУММА К ОПЛАТЕ:</div>
            <div id="display-amt" style="font-size: 32px; font-weight: 900; color: var(--primary);">0.00 ₽</div>
        </div>

        <input type="text" id="card-num" placeholder="НОМЕР КАРТЫ">
        <input type="password" id="card-pin" placeholder="PIN-CODE" maxlength="4">

        <button id="pay-btn" onclick="sendPaymentSignal()">ПОДТВЕРДИТЬ ОПЛАТУ</button>
        <div id="status" style="margin-top: 15px; font-size: 12px; opacity: 0.7;">СИНХРОНИЗАЦИЯ...</div>
    </div>

    <script>
        const DB_URL = "https://cassa-simulator-4-default-rtdb.firebaseio.com";
        
        // Используем тот же ID, что и Сбер
        const TID = localStorage.getItem('terminal_id') || Math.floor(100000 + Math.random() * 900000).toString();
        localStorage.setItem('terminal_id', TID);
        document.getElementById('display-id').innerText = TID;

        let currentAmount = 0;

        // Омега слушает папку commands, чтобы видеть, что сейчас на экране Сбера
        async function watchSber() {
            try {
                const res = await fetch(`${DB_URL}/commands/${TID}.json`);
                const data = await res.json();
                const btn = document.getElementById('pay-btn');
                const status = document.getElementById('status');

                if (data && data.command === "PAY") {
                    currentAmount = data.amount;
                    document.getElementById('display-amt').innerText = currentAmount + " ₽";
                    btn.disabled = false;
                    btn.style.opacity = "1";
                    status.innerHTML = '<span class="status-dot"></span> ЖДЕТ ОПЛАТЫ';
                } else {
                    document.getElementById('display-amt').innerText = "0.00 ₽";
                    btn.disabled = true;
                    btn.style.opacity = "0.3";
                    status.innerText = "НЕТ АКТИВНЫХ ЗАКАЗОВ";
                }
            } catch (e) { console.error("Ошибка связи"); }
        }

        // САМАЯ ВАЖНАЯ ЧАСТЬ: Отправка сигнала в папку, которую ждет Сбер
        async function sendPaymentSignal() {
            const btn = document.getElementById('pay-btn');
            btn.innerText = "ОТПРАВКА...";
            btn.disabled = true;

            try {
                // 1. Сначала записываем статус SUCCESS в /status/ID (чтобы сработал finishPay в Сбере)
                await fetch(`${DB_URL}/status/${TID}.json`, {
                    method: 'PATCH',
                    body: JSON.stringify({ 
                        state: "SUCCESS", 
                        lastUpdate: Date.now() 
                    })
                });

                // 2. Удаляем команду из /commands/ID, чтобы Сбер убрал экран оплаты
                await fetch(`${DB_URL}/commands/${TID}.json`, { method: 'DELETE' });

                btn.innerText = "ОПЛАЧЕНО ✅";
                btn.style.background = "white";

                // Перезагрузка через 3 сек
                setTimeout(() => location.reload(), 3000);

            } catch (e) {
                alert("Ошибка при передаче сигнала!");
                btn.disabled = false;
                btn.innerText = "ПОДТВЕРДИТЬ ОПЛАТУ";
            }
        }

        // Проверяем состояние каждые 2 секунды
        setInterval(watchSber, 2000);
    </script>
</body>
</html>
