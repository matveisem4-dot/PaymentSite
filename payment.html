<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оплата заказа 2026</title>
    <style>
        html { font-size: 16px; }
        body { 
            font-family: sans-serif; text-align: center; background-color: #000; color: white;
            margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; 
        }
        .container { 
            width: 380px; height: 600px; max-width: 90%; 
            border: 1px solid rgba(255, 255, 255, 0.2); 
            padding: 1.5rem; border-radius: 15px; 
            background: linear-gradient(to bottom, #004d25, #008000, #4CAF50);
            box-shadow: 0 4px 6px rgba(0,0,0,0.5); box-sizing: border-box; 
            display: flex; flex-direction: column; justify-content: center;
        }
        .input-group { margin-bottom: 1.25rem; text-align: left; }
        label { display: block; margin-bottom: 0.5rem; font-weight: bold; font-size: 0.9rem; }
        input { 
            padding: 0.75rem; font-size: 1.2rem; width: 100%; box-sizing: border-box; 
            border-radius: 5px; background-color: black; border: 1px solid #444;
            color: #00ff41; outline: none;
        }
        #payment-input { font-size: 2.2rem; font-weight: 900; background-color: #1a1a1a; }
        button { 
            padding: 1.2rem; font-size: 1.1rem; border: none; cursor: pointer; width: 100%; 
            font-weight: bold; border-radius: 5px; margin-top: 1rem; 
            background-color: #007bff; color: white;
        }
        /* ОГРОМНЫЙ СПИННЕР */
        .modal {
            display: none; position: fixed; z-index: 1000; left: 0; top: 0;
            width: 100%; height: 100%; background-color: rgba(0,0,0,0.95);
            justify-content: center; align-items: center; flex-direction: column;
        }
        .spinner {
            border: 10px solid rgba(255, 255, 255, 0.1); border-top: 10px solid #00ff41;
            border-radius: 50%; width: 120px; height: 120px;
            animation: spin 1s linear infinite; margin-bottom: 2rem;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #status-text { margin-top: 1rem; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Оплата заказа</h1>
        <div class="input-group">
            <label>ID ТЕРМИНАЛА:</label>
            <input type="number" id="terminal-id" placeholder="00000" value="12345">
        </div>
        <div class="input-group">
            <label>СУММА ОПЛАТЫ:</label>
            <input type="number" id="payment-input" placeholder="0.00">
        </div>
        <button onclick="handlePayment()">ОТПРАВИТЬ ЗАПРОС</button>
        <p id="status-text">Готов к работе</p>
    </div>

    <div id="loading-modal" class="modal">
        <div class="spinner"></div>
        <p id="loading-text" style="font-size: 1.4rem;"></p>
    </div>

    <script>
        const FB_URL = "https://cassa-simulator-4-default-rtdb.firebaseio.com";

        async function handlePayment() {
            const tid = document.getElementById('terminal-id').value.trim();
            const amount = parseFloat(document.getElementById('payment-input').value);
            const status = document.getElementById('status-text');

            // ОБРАБОТКА И ПРОВЕРКА СУММЫ
            if (!tid || isNaN(amount) || amount <= 0) {
                status.innerText = "ОШИБКА: Введите ID и сумму!";
                status.style.color = "red";
                return;
            }

            const finalAmount = amount.toFixed(2);
            const modal = document.getElementById('loading-modal');
            const lText = document.getElementById('loading-text');

            modal.style.display = "flex";
            lText.innerText = "Отправляю запрос в банк...";

            try {
                // ШАГ 1: Реализм
                await new Promise(r => setTimeout(r, 1500));
                lText.innerText = "Ответ получен. Связь с терминалом...";

                // ШАГ 2: ОТПРАВЛЯЕМ СИГНАЛ, КОТОРЫЙ ЖДЕТ ТЕРМИНАЛ
                // Мы пишем в commands, чтобы терминал "проснулся"
                await fetch(`${FB_URL}/commands/${tid}.json`, {
                    method: 'PUT',
                    body: JSON.stringify({
                        command: "PAY",
                        amount: finalAmount,
                        timestamp: Date.now()
                    })
                });

                // Также обновляем статус для синхронизации
                await fetch(`${FB_URL}/status/${tid}.json`, {
                    method: 'PUT',
                    body: JSON.stringify({ state: "WAITING_PAYMENT", amount: finalAmount })
                });

                await new Promise(r => setTimeout(r, 1000));
                modal.style.display = "none";
                status.innerText = "ОЖИДАНИЕ ОПЛАТЫ...";
                status.style.color = "orange";

                // ШАГ 3: Ждем SUCCESS от терминала
                const check = setInterval(async () => {
                    const res = await fetch(`${FB_URL}/status/${tid}.json`);
                    const data = await res.json();
                    if (data && data.state === "SUCCESS") {
                        clearInterval(check);
                        status.innerText = "✅ ОПЛАЧЕНО!";
                        status.style.color = "#00ff41";
                        alert("Платеж подтвержден!");
                    }
                }, 2000);

            } catch (e) {
                modal.style.display = "none";
                status.innerText = "Ошибка сети!";
            }
        }
    </script>
</body>
</html>
