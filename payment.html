<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omega Pay Terminal 2026</title>
    <style>
        :root {
            --bg: #050508;
            --primary: #00ff88;
            --accent: #4f8aff;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            background: var(--bg);
            color: white;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            overflow: hidden;
            position: relative;
        }

        .nebula {
            position: absolute;
            width: 80vw; height: 80vw;
            filter: blur(100px);
            border-radius: 50%;
            z-index: -2;
            opacity: 0.3;
            animation: drift 20s infinite alternate ease-in-out;
        }
        .nebula-1 { top: -20%; left: -20%; background: rgba(0, 255, 136, 0.2); }
        .nebula-2 { bottom: -20%; right: -10%; background: rgba(79, 138, 255, 0.25); }

        @keyframes drift {
            from { transform: translate(0, 0); }
            to { transform: translate(10%, 10%); }
        }

        .card-box {
            position: relative;
            width: 360px;
            padding: 40px;
            border-radius: 30px;
            background: rgba(15, 15, 25, 0.8);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(25px);
            text-align: center;
            box-shadow: 0 25px 80px rgba(0,0,0,0.8);
            z-index: 5;
        }

        h2 {
            font-weight: 900;
            letter-spacing: 3px;
            margin-bottom: 30px;
            background: linear-gradient(to right, #fff, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        input {
            width: 100%;
            padding: 18px;
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            color: white;
            font-size: 18px;
            text-align: center;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.2);
        }

        button {
            width: 100%;
            padding: 20px;
            border-radius: 15px;
            border: none;
            background: var(--primary);
            color: #050508;
            font-weight: 900;
            font-size: 18px;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s;
        }

        button:disabled {
            background: #222;
            color: #555;
            cursor: not-allowed;
        }

        #msg { margin-top: 20px; font-size: 14px; min-height: 20px; font-weight: 600; }
        
        /* Анимация мигания для поля суммы, когда она найдена */
        .amount-active {
            animation: pulse-border 1.5s infinite;
            color: var(--primary) !important;
        }

        @keyframes pulse-border {
            0% { border-color: rgba(0, 255, 136, 0.2); }
            50% { border-color: rgba(0, 255, 136, 1); }
            100% { border-color: rgba(0, 255, 136, 0.2); }
        }
    </style>
</head>
<body>

    <div class="nebula nebula-1"></div>
    <div class="nebula nebula-2"></div>

    <div class="card-box">
        <h2>TERMINAL</h2>
        
        <input type="number" id="tid" placeholder="TERMINAL ID">
        
        <input type="text" id="cnum" placeholder="0000 0000 0000 0000" maxlength="19">
        
        <div style="display:flex; gap:15px">
            <input type="password" id="pin" placeholder="PIN" maxlength="4">
            <input type="text" id="amt-display" placeholder="0.00 ₽" readonly style="font-weight:900;">
        </div>

        <button id="pay-btn" onclick="processPayment()" disabled>ЖДЕМ ЗАКАЗ</button>
        <div id="msg"></div>
    </div>

    <script>
        // ВАЖНО: Путь должен быть /status/ как в твоем коде кассы!
        const DB_BASE = "https://cassa-simulator-4-default-rtdb.firebaseio.com/status";

        const tidInput = document.getElementById('tid');
        const amtDisplay = document.getElementById('amt-display');
        const payBtn = document.getElementById('pay-btn');
        const msg = document.getElementById('msg');

        // 1. Форматирование карты
        document.getElementById('cnum').addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/[^\d]/g, '').replace(/(.{4})/g, '$1 ').trim();
        });

        // 2. АВТО-ПОИСК СУММЫ ПРИ ВВОДЕ ID
        tidInput.addEventListener('input', async () => {
            const id = tidInput.value;
            if (id.length < 1) return resetUI();

            try {
                const res = await fetch(`${DB_BASE}/${id}.json`);
                const data = await res.json();

                if (data && data.state === "WAITING_PAYMENT") {
                    amtDisplay.value = data.amount + " ₽";
                    amtDisplay.classList.add('amount-active');
                    payBtn.disabled = false;
                    payBtn.innerText = "ОПЛАТИТЬ";
                    msg.innerHTML = "<span style='color:var(--primary)'>✅ ЗАКАЗ НАЙДЕН</span>";
                } else {
                    resetUI("Ожидание счета...");
                }
            } catch (e) {
                console.error("Ошибка сети");
            }
        });

        function resetUI(text = "ЖДЕМ ЗАКАЗ") {
            amtDisplay.value = "";
            amtDisplay.classList.remove('amount-active');
            payBtn.disabled = true;
            payBtn.innerText = text;
            msg.innerText = "";
        }

        // 3. ОБРАБОТКА ОПЛАТЫ
        async function processPayment() {
            const id = tidInput.value;
            const pin = document.getElementById('pin').value;

            if (pin.length < 4) {
                msg.innerHTML = "<span style='color:#ff4757'>⚠️ ВВЕДИТЕ PIN</span>";
                return;
            }

            payBtn.disabled = true;
            payBtn.innerText = "ОБРАБОТКА...";

            try {
                // Отправляем статус SUCCESS в базу
                await fetch(`${DB_BASE}/${id}.json`, {
                    method: 'PATCH',
                    body: JSON.stringify({ state: "SUCCESS" })
                });

                msg.innerHTML = "<span style='color:var(--primary); font-size: 18px;'>✅ ОПЛАЧЕНО УСПЕШНО</span>";
                
                setTimeout(() => {
                    location.reload();
                }, 3000);

            } catch (e) {
                msg.innerHTML = "<span style='color:#ff4757'>❌ ОШИБКА СЕТИ</span>";
                payBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
