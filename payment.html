<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оплата заказа 2026</title>
    <style>
        html { font-size: 16px; }
        body { 
            font-family: sans-serif; text-align: center; background-color: #000000; color: white;
            margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; 
        }
        .container { 
            width: 380px; height: 600px; max-width: 90%; 
            border: 1px solid rgba(255, 255, 255, 0.2); 
            padding: 1.5rem; border-radius: 15px; 
            background: linear-gradient(to bottom, #004d25, #008000, #4CAF50);
            box-shadow: 0 4px 6px rgba(0,0,0,0.5); box-sizing: border-box; 
            display: flex; flex-direction: column; justify-content: center;
        }
        h1 { margin-top: 0; font-size: 1.5rem; text-transform: uppercase; letter-spacing: 1px; } 
        
        .input-group { margin-bottom: 1.25rem; text-align: left; }
        label { display: block; margin-bottom: 0.5rem; font-weight: bold; font-size: 0.9rem; color: rgba(255,255,255,0.9); }
        input { 
            padding: 0.75rem; font-size: 1rem; width: 100%; box-sizing: border-box; 
            border: 1px solid #ddd; border-radius: 5px; background-color: black; 
            color: #00ff41; caret-color: #00ff41; outline: none;
        }
        
        #payment-input {
            font-size: 2.2rem; font-weight: 900; text-align: left; 
            color: #00ff41; background-color: #1a1a1a;
        }

        button { 
            padding: 1.2rem; font-size: 1.1rem; border: none; cursor: pointer; width: 100%; 
            font-weight: bold; border-radius: 5px; margin-top: 0.75rem; 
            background-color: #007bff; color: white;
            box-shadow: 0 4px 12px rgba(0, 123, 255, 0.4); transition: all 0.2s;
        }
        button:active { transform: translateY(2px); }
        
        #status-text { margin-top: 1.5rem; font-weight: bold; font-size: 0.9rem; min-height: 1.2em; }

        /* Огромный спиннер */
        .modal {
            display: none; position: fixed; z-index: 1000; left: 0; top: 0;
            width: 100%; height: 100%; background-color: rgba(0,0,0,0.95);
            justify-content: center; align-items: center; flex-direction: column;
        }
        .spinner {
            border: 10px solid rgba(255, 255, 255, 0.1);
            border-top: 10px solid #00ff41;
            border-radius: 50%; width: 120px; height: 120px; /* ОЧЕНЬ БОЛЬШОЙ */
            animation: spin 1s linear infinite; margin-bottom: 2rem;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #success-modal .checkmark { font-size: 5rem; color: #00ff41; margin-bottom: 1rem; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Оплата заказа 2026</h1>
        
        <div class="input-group">
            <label>ID ТЕРМИНАЛА (5 ЦИФР):</label>
            <input type="number" id="terminal-id" placeholder="00000">
        </div>

        <div class="input-group">
            <label>СУММА ОПЛАТЫ (РУБ):</label>
            <input type="number" id="payment-input" placeholder="0.00" step="0.01">
        </div>
        
        <button onclick="handlePaymentClick()">ОТПРАВИТЬ ЗАПРОС</button>
        
        <p id="status-text">Система готова</p>
    </div>

    <!-- Загрузка -->
    <div id="loading-modal" class="modal">
        <div class="spinner"></div>
        <p id="loading-text" style="font-size: 1.4rem; font-weight: bold;"></p>
    </div>

    <!-- Успех -->
    <div id="success-modal" class="modal">
        <div class="checkmark">✅</div>
        <p style="font-size: 1.5rem; font-weight: bold;">ОПЛАЧЕНО УСПЕШНО!</p>
        <button onclick="closeSuccess()" style="width: auto; padding: 10px 50px; background: #00ff41; color: #000;">ОК</button>
    </div>

    <script>
        const FB_URL = "https://cassa-simulator-4-default-rtdb.firebaseio.com";

        async function handlePaymentClick() {
            const tid = document.getElementById('terminal-id').value.trim();
            const amtVal = document.getElementById('payment-input').value;
            const amount = parseFloat(amtVal);
            const status = document.getElementById('status-text');

            // 1. ЖЕСТКАЯ ПРОВЕРКА СУММЫ И ID
            if (!tid || tid.length < 4) {
                status.innerText = "ОШИБКА: НЕВЕРНЫЙ ID ТЕРМИНАЛА";
                status.style.color = "red";
                return;
            }
            if (isNaN(amount) || amount <= 0) {
                status.innerText = "ОШИБКА: ВВЕДИТЕ СУММУ ЦИФРАМИ";
                status.style.color = "red";
                return;
            }

            const finalAmount = amount.toFixed(2);
            
            // 2. ПОШАГОВАЯ ЗАГРУЗКА
            const modal = document.getElementById('loading-modal');
            const lText = document.getElementById('loading-text');
            
            modal.style.display = "flex";
            lText.innerText = "Отправляю запрос в банк...";

            try {
                await new Promise(r => setTimeout(r, 1500));
                lText.innerText = "Ответ получен. Синхронизация...";

                // ОТПРАВЛЯЕМ СИГНАЛ В БАЗУ
                await fetch(`${FB_URL}/status/${tid}.json`, {
                    method: 'PUT',
                    body: JSON.stringify({
                        state: "WAITING_PAYMENT",
                        amount: finalAmount,
                        timestamp: Date.now()
                    })
                });

                await new Promise(r => setTimeout(r, 1000));
                modal.style.display = "none";
                
                status.innerText = "ОЖИДАНИЕ ОПЛАТЫ НА ТЕРМИНАЛЕ...";
                status.style.color = "orange";

                // 3. ПРОВЕРКА ОТВЕТА ОТ ТЕРМИНАЛА
                const checker = setInterval(async () => {
                    const res = await fetch(`${FB_URL}/status/${tid}.json`);
                    const data = await res.json();
                    if (data && data.state === "SUCCESS") {
                        clearInterval(checker);
                        document.getElementById('success-modal').style.display = "flex";
                        status.innerText = "✅ ОПЛАЧЕНО";
                        status.style.color = "#00ff41";
                    }
                }, 2000);

            } catch (e) {
                modal.style.display = "none";
                status.innerText = "ОШИБКА СЕТИ";
                status.style.color = "red";
            }
        }

        function closeSuccess() {
            document.getElementById('success-modal').style.display = "none";
            document.getElementById('status-text').innerText = "Система готова";
            document.getElementById('status-text').style.color = "white";
        }
    </script>
</body>
</html>
