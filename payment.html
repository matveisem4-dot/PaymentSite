<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>ONYX: КАССА-КОНТРОЛЬ</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0b0f19; color: #fff; text-align: center; padding: 20px; }
        .container { max-width: 400px; margin: auto; background: #161b22; padding: 25px; border-radius: 12px; border: 1px solid #30363d; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
        h2 { color: #58a6ff; margin-bottom: 20px; }
        .input-box { text-align: left; margin-bottom: 15px; }
        label { display: block; font-size: 12px; color: #8b949e; margin-bottom: 5px; }
        input { width: 100%; padding: 12px; background: #0d1117; border: 1px solid #30363d; color: #00ff41; border-radius: 6px; font-size: 18px; box-sizing: border-box; outline: none; }
        input:focus { border-color: #58a6ff; }
        .btn-pay { background: #238636; color: #fff; border: none; padding: 15px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 10px; transition: 0.2s; }
        .btn-pay:hover { background: #2ea043; }
        .btn-pay:disabled { background: #21262d; color: #484f58; cursor: not-allowed; }
        #status { margin-top: 15px; font-size: 14px; padding: 10px; border-radius: 4px; min-height: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h2>ONYX PAY CONTROL</h2>
    
    <div class="input-box">
        <label>ID ТЕРМИНАЛА</label>
        <input type="number" id="tid" value="123456">
    </div>

    <div class="input-box">
        <label>СУММА ОПЛАТЫ (РУБ)</label>
        <input type="number" id="amt" value="100.00">
    </div>

    <button class="btn-pay" id="mainBtn" onclick="processPayment()">ПОДТВЕРДИТЬ ОПЛАТУ</button>
    <div id="status">Система готова</div>
</div>

<script>
    const DB_URL = "https://cassa-simulator-4-default-rtdb.firebaseio.com";

    async function processPayment() {
        const id = document.getElementById('tid').value;
        const userAmt = parseFloat(document.getElementById('amt').value);
        const statusDiv = document.getElementById('status');
        const btn = document.getElementById('mainBtn');

        if (!id || isNaN(userAmt)) return updateStatus("Ошибка ввода", "red");

        try {
            btn.disabled = true;
            updateStatus("Проверка терминала...", "orange");

            // 1. Сначала проверяем, что происходит на терминале
            const res = await fetch(`${DB_URL}/commands/${id}.json`);
            const cmdData = await res.json();

            // Проверка: есть ли вообще активный запрос на оплату?
            if (!cmdData || cmdData.command !== "PAY") {
                updateStatus("ОШИБКА: Терминал не ждет оплаты!", "#ff4444");
                btn.disabled = false;
                return;
            }

            // 2. ПРОВЕРКА СУММЫ: совпадает ли сумма в кассе с тем, что на терминале?
            const terminalAmt = parseFloat(cmdData.amount);
            if (userAmt !== terminalAmt) {
                updateStatus(`ОШИБКА: Сумма не совпадает! На терминале: ${terminalAmt} ₽`, "#ff4444");
                btn.disabled = false;
                return;
            }

            // 3. Если всё ок — отправляем сигнал успеха
            updateStatus("Сумма верна. Отправка подтверждения...", "cyan");
            
            await fetch(`${DB_URL}/status/${id}.json`, {
                method: 'PATCH',
                body: JSON.stringify({ 
                    state: "SUCCESS", 
                    paidAmount: userAmt,
                    confirmedBy: "Admin" 
                })
            });

            updateStatus("✅ ОПЛАЧЕНО УСПЕШНО", "#00ff41");
            
            // Очищаем команду через секунду
            setTimeout(() => fetch(`${DB_URL}/commands/${id}.json`, { method: 'DELETE' }), 1000);

        } catch (e) {
            updateStatus("Ошибка связи: " + e.message, "red");
        } finally {
            btn.disabled = false;
        }
    }

    function updateStatus(msg, color) {
        const s = document.getElementById('status');
        s.innerText = msg;
        s.style.color = color;
        s.style.background = `rgba(255,255,255,0.05)`;
    }
</script>

</body>
</html>
