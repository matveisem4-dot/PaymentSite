<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление оплатой 2026 (Касса)</title>
    <style>
        html { font-size: 16px; }
        body { 
            font-family: sans-serif; text-align: center; background-color: #121212; color: white;
            margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; 
        }
        .container { 
            width: 380px; height: 500px; max-width: 90%; 
            padding: 2rem; border-radius: 20px; 
            background: linear-gradient(135deg, #004d25 0%, #1a1a1a 100%);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            display: flex; flex-direction: column; justify-content: center;
        }
        h1 { margin-bottom: 2rem; font-size: 1.4rem; color: #7cec84; } 
        .input-group { margin-bottom: 1.5rem; text-align: left; }
        label { display: block; margin-bottom: 0.5rem; color: #aaa; font-size: 0.8rem; letter-spacing: 1px; }
        input { 
            padding: 1rem; font-size: 1.2rem; width: 100%; box-sizing: border-box; 
            border: 1px solid #333; border-radius: 10px; background-color: #000; 
            color: #7cec84; outline: none;
        }
        button { 
            padding: 1.2rem; font-size: 1rem; border: none; cursor: pointer; width: 100%; 
            font-weight: bold; border-radius: 12px; margin-top: 1rem; 
            transition: all 0.2s ease; background-color: #7cec84; color: #004d25;
        }
        
        /* Модальные окна и спиннер */
        .modal {
            display: none; position: fixed; z-index: 100; left: 0; top: 0;
            width: 100%; height: 100%; background-color: rgba(0,0,0,0.9);
            justify-content: center; align-items: center; flex-direction: column;
            color: white;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1); border-top: 4px solid #7cec84; 
            border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #success-modal .checkmark { font-size: 4rem; color: #7cec84; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>КАССА ОПЕРАТОРА</h1>
        
        <div class="input-group">
            <label>ID ТЕРМИНАЛА (5 ЦИФР):</label>
            <input type="number" id="terminal-id" placeholder="00000">
        </div>

        <div class="input-group">
            <label>СУММА К ОПЛАТЕ (РУБ):</label>
            <input type="number" id="payment-input" placeholder="0.00" value="100.00">
        </div>
        
        <button class="btn-pay" onclick="handlePaymentClick()">ВЫВЕСТИ СЧЕТ</button>
        <p id="status-text" style="margin-top: 15px; font-size: 0.8rem;">Введите данные</p>
    </div>

    <!-- Модальное окно загрузки -->
    <div id="loading-modal" class="modal">
        <div class="spinner"></div>
        <p id="loading-text">Отправка...</p>
    </div>

    <!-- Модальное окно успеха -->
    <div id="success-modal" class="modal">
        <div class="checkmark">✅</div>
        <p>ОПЛАЧЕНО УСПЕШНО!</p>
        <button onclick="hideSuccessModal()" style="width: auto; padding: 10px 40px;">ГОТОВО</button>
    </div>

    <script>
        const FIREBASE_BASE_URL = "https://cassa-simulator-4-default-rtdb.firebaseio.com";

        // Показывает модальное окно загрузки с текстом
        function showLoadingModal(text) {
            document.getElementById('loading-text').innerText = text;
            document.getElementById('loading-modal').style.display = 'flex';
        }

        // Скрывает модальное окно загрузки
        function hideLoadingModal() {
            document.getElementById('loading-modal').style.display = 'none';
        }
        
        // Показывает модальное окно успеха
        function showSuccessModal() {
            document.getElementById('success-modal').style.display = 'flex';
        }
        
        // Скрывает модальное окно успеха
        function hideSuccessModal() {
            document.getElementById('success-modal').style.display = 'none';
            document.getElementById('status-text').innerText = "Система готова";
        }


        // ГЛАВНАЯ ФУНКЦИЯ КАССЫ
        async function handlePaymentClick() {
            const tid = document.getElementById('terminal-id').value;
            const rawAmount = document.getElementById('payment-input').value;
            const amount = parseFloat(rawAmount);
            const statusText = document.getElementById('status-text');

            if (!tid || isNaN(amount) || amount <= 0) {
                statusText.style.color = "red";
                statusText.innerText = "Ошибка: проверьте ID и сумму!";
                return;
            }

            const finalAmount = amount.toFixed(2);

            // ПОШАГОВАЯ ЗАГРУЗКА ИМИТАЦИЯ
            showLoadingModal('Отправляю запрос в банк...');
            
            try {
                await new Promise(r => setTimeout(r, 1500)); 
                document.getElementById('loading-text').innerText = 'Ожидание ответа от банка...';
                
                await new Promise(r => setTimeout(r, 1200));
                document.getElementById('loading-text').innerText = 'Ответ получен. Синхронизация с терминалом...';

                // Отправляем данные в базу для терминала
                await fetch(`${FIREBASE_BASE_URL}/commands/${tid}.json`, {
                    method: 'PUT',
                    body: JSON.stringify({ type: "PAY", amount: finalAmount })
                });

                await fetch(`${FIREBASE_BASE_URL}/status/${tid}.json`, {
                    method: 'PUT',
                    body: JSON.stringify({ state: "WAITING_PAYMENT", amount: finalAmount })
                });

                await new Promise(r => setTimeout(r, 800));
                
                hideLoadingModal();
                statusText.style.color = "orange";
                statusText.innerText = `Запрос на ${finalAmount} РУБ отправлен. Ожидайте...`;

                // Запуск проверки: нажал ли юзер "Оплатить" на терминале
                const checkInterval = setInterval(async () => {
                    const res = await fetch(`${FIREBASE_BASE_URL}/status/${tid}.json`);
                    const data = await res.json();
                    
                    if (data && data.state === "SUCCESS") {
                        clearInterval(checkInterval);
                        showSuccessModal();
                        statusText.style.color = "#00ff41";
                        statusText.innerText = "✅ ОПЛАЧЕНО УСПЕШНО";
                    }
                }, 2000);

            } catch (error) {
                hideLoadingModal();
                statusText.style.color = "red";
                statusText.innerText = "Ошибка связи!";
            }
        }
    </script>
</body>
</html>
