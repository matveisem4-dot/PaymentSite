<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Processing 2026 | No-Alerts Edition</title>
    <style>
        :root {
            --accent: #00ff88;
            --bg: #0a0a0f;
            --card-inner: #161620;
            --input-bg: #0d0d14;
            --text: #e0e0e0;
            --error: #ff4757;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .payment-box {
            width: 380px;
            background: var(--card-inner);
            border-radius: 28px;
            padding: 30px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.7);
            border: 1px solid rgba(255,255,255,0.05);
            position: relative;
        }

        /* Красивое уведомление внутри дизайна */
        #notify {
            position: absolute;
            top: 20px; left: 20px; right: 20px;
            padding: 15px;
            border-radius: 12px;
            font-size: 13px;
            text-align: center;
            transform: translateY(-50px);
            opacity: 0;
            transition: 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            z-index: 200;
        }
        #notify.show { transform: translateY(0); opacity: 1; }
        .ntf-error { background: rgba(255, 71, 87, 0.2); color: var(--error); border: 1px solid var(--error); }
        .ntf-success { background: rgba(0, 255, 136, 0.2); color: var(--accent); border: 1px solid var(--accent); }

        h2 { margin: 0; text-align: center; letter-spacing: 2px; color: white; font-size: 1.2rem; }
        .subtitle { display: block; text-align: center; font-size: 10px; color: #555; margin-bottom: 25px; letter-spacing: 1px; }

        .field { margin-bottom: 15px; }
        .field label { display: block; font-size: 10px; color: var(--accent); text-transform: uppercase; margin-bottom: 6px; font-weight: bold; }
        
        input {
            width: 100%; padding: 14px; border-radius: 12px;
            border: 1px solid #2a2a35; background: var(--input-bg);
            color: white; font-size: 16px; font-family: 'Courier New', monospace;
            box-sizing: border-box; outline: none; transition: 0.3s;
        }
        input:focus { border-color: var(--accent); background: #11111a; }

        .visual-card {
            background: linear-gradient(145deg, #1e1e2d 0%, #0d0d14 100%);
            padding: 20px; border-radius: 18px; margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.03);
        }

        .row { display: flex; gap: 10px; }

        button {
            width: 100%; padding: 18px; border: none; border-radius: 14px;
            background: var(--accent); color: #050508;
            font-size: 14px; font-weight: 800; cursor: pointer;
            text-transform: uppercase; letter-spacing: 1px; transition: 0.3s;
        }
        button:hover { filter: brightness(1.1); transform: translateY(-2px); }
        button:disabled { background: #333; color: #666; cursor: not-allowed; transform: none; }

        /* Процессинг */
        #overlay {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--card-inner); border-radius: 28px; z-index: 100;
            flex-direction: column; justify-content: center; align-items: center;
        }
        .spinner {
            width: 40px; height: 40px; border: 3px solid rgba(0,255,136,0.1);
            border-top: 3px solid var(--accent); border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #status-text { margin-top: 15px; font-size: 11px; color: var(--accent); text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="payment-box">
        <div id="notify"></div>

        <div id="ui-content">
            <h2>GATEWAY v4.0</h2>
            <span class="subtitle">Secure No-Alert Processing</span>

            <div class="field">
                <label>Terminal ID</label>
                <input type="number" id="tid" placeholder="Введите ID кассы">
            </div>

            <div class="visual-card">
                <div class="field">
                    <label>Card Number</label>
                    <input type="text" id="c-num" placeholder="0000 0000 0000 0000" maxlength="19">
                </div>
                <div class="row">
                    <div style="flex:2"><input type="text" id="c-date" placeholder="MM/YY" maxlength="5"></div>
                    <div style="flex:1"><input type="password" id="c-cvv" placeholder="CVV" maxlength="3"></div>
                </div>
            </div>

            <div class="field">
                <label>Amount (RUB)</label>
                <input type="number" id="amount" placeholder="0.00">
            </div>

            <button id="main-btn" onclick="process()">Pay Now</button>
        </div>

        <div id="overlay">
            <div class="spinner"></div>
            <div id="status-text">CONNECTING...</div>
        </div>
    </div>

    <script>
        const DB_URL = "https://cassa-simulator-4-default-rtdb.firebaseio.com";

        // Функция показа уведомлений вместо alert()
        function showNotify(text, type = 'error') {
            const n = document.getElementById('notify');
            n.innerText = text;
            n.className = type === 'error' ? 'ntf-error show' : 'ntf-success show';
            setTimeout(() => n.classList.remove('show'), 3000);
        }

        // Маски ввода
        document.getElementById('c-num').addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/[^\d]/g, '').replace(/(.{4})/g, '$1 ').trim();
        });
        document.getElementById('c-date').addEventListener('input', (e) => {
            let v = e.target.value.replace(/[^\d]/g, '');
            if (v.length >= 3) e.target.value = v.slice(0,2) + '/' + v.slice(2,4);
        });

        async function process() {
            const tid = document.getElementById('tid').value;
            const amt = document.getElementById('amount').value;
            const btn = document.getElementById('main-btn');
            
            if (!tid || !amt) {
                showNotify("Заполните ID и сумму");
                return;
            }

            btn.disabled = true;

            try {
                const res = await fetch(`${DB_URL}/status/${tid}.json`);
                const data = await res.json();

                if (!data || data.state !== "WAITING_PAYMENT") {
                    showNotify("Терминал не готов к оплате");
                    btn.disabled = false;
                    return;
                }

                // Запуск процессинга
                document.getElementById('overlay').style.display = 'flex';
                const st = document.getElementById('status-text');

                setTimeout(() => st.innerText = "AUTHORIZING...", 1500);
                setTimeout(() => st.innerText = "SECURE SYNC...", 3000);

                setTimeout(async () => {
                    await fetch(`${DB_URL}/status/${tid}.json`, {
                        method: 'PATCH',
                        body: JSON.stringify({ state: "SUCCESS", lastUpdate: Date.now() })
                    });
                    
                    document.getElementById('overlay').style.display = 'none';
                    showNotify("ОПЛАТА ПРОШЛА УСПЕШНО", "success");
                    
                    setTimeout(() => location.reload(), 2500);
                }, 4500);

            } catch (e) {
                showNotify("Ошибка сети. Проверьте связь.");
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
