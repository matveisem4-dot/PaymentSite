<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omega Pay Terminal 2026</title>
    <style>
        :root {
            --bg: #050508;
            --primary: #00ff88; /* Неоновый зеленый */
            --accent: #4f8aff;  /* Синий из кассы для связи стилей */
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        /* === МЕГА ОМЕГА ФОН === */
        body {
            background: var(--bg);
            color: white;
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            overflow: hidden;
            position: relative;
        }

        /* Анимированные туманности */
        .nebula {
            position: absolute;
            width: 80vw; height: 80vw;
            filter: blur(100px);
            border-radius: 50%;
            z-index: -2;
            opacity: 0.4;
            animation: drift 20s infinite alternate ease-in-out;
        }
        .nebula-1 { top: -20%; left: -20%; background: rgba(0, 255, 136, 0.2); }
        .nebula-2 { bottom: -20%; right: -10%; background: rgba(79, 138, 255, 0.25); animation-delay: -5s; }

        @keyframes drift {
            from { transform: translate(0, 0) scale(1); }
            to { transform: translate(10%, 10%) scale(1.2); }
        }

        /* Эффект сканирующих линий (CRT) */
        body::after {
            content: "";
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
            background-size: 100% 3px, 3px 100%;
            z-index: 10;
            pointer-events: none;
        }

        /* === КАРТОЧКА ТЕРМИНАЛА === */
        .card-box {
            position: relative;
            width: 360px;
            padding: 40px;
            border-radius: 30px;
            background: rgba(15, 15, 25, 0.7);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            text-align: center;
            box-shadow: 0 25px 80px rgba(0,0,0,0.8), inset 0 0 20px rgba(255,255,255,0.02);
            z-index: 5;
        }

        /* Световой ободок карточки */
        .card-box::before {
            content: "";
            position: absolute; -top: 1px; -left: 1px; -right: 1px; -bottom: 1px;
            border-radius: 30px;
            padding: 1px;
            background: linear-gradient(135deg, var(--glass-border), var(--primary), transparent, var(--accent));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        h2 {
            font-weight: 900;
            letter-spacing: 3px;
            margin-bottom: 30px;
            background: linear-gradient(to right, #fff, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* ПОЛЯ ВВОДА */
        input {
            width: 100%;
            padding: 18px;
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            color: white;
            font-size: 18px;
            text-align: center;
            box-sizing: border-box;
            outline: none;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-family: 'Courier New', monospace; /* Для вида банковской карты */
        }

        input:focus {
            border-color: var(--primary);
            background: rgba(0, 255, 136, 0.05);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.15);
            transform: scale(1.02);
        }

        input::placeholder { color: rgba(255,255,255,0.2); letter-spacing: 1px; }

        /* КНОПКА */
        button {
            width: 100%;
            padding: 20px;
            border-radius: 15px;
            border: none;
            background: var(--primary);
            color: #050508;
            font-weight: 900;
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: 0.3s;
            position: relative;
            overflow: hidden;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 255, 136, 0.4);
            filter: brightness(1.1);
        }

        button:active { transform: translateY(0) scale(0.98); }

        button:disabled {
            background: #1a1a1a;
            color: #444;
            transform: none;
            box-shadow: none;
        }

        /* Блик на кнопке */
        button::after {
            content: "";
            position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.3), transparent);
            transform: rotate(45deg);
            transition: 0.5s;
        }
        button:hover::after { left: 100%; }

        #msg {
            margin-top: 25px;
            font-size: 14px;
            font-weight: 600;
            min-height: 20px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .secure-tag {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 20px;
            font-size: 10px;
            color: rgba(255,255,255,0.3);
            text-transform: uppercase;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div class="nebula nebula-1"></div>
    <div class="nebula nebula-2"></div>

    <div class="card-box">
        <h2>TERMINAL</h2>
        
        <input type="number" id="tid" placeholder="TERMINAL ID">
        <input type="text" id="cnum" placeholder="0000 0000 0000 0000" maxlength="19">
        
        <div style="display:flex; gap:15px">
            <input type="password" id="pin" placeholder="PIN" maxlength="4">
            <input type="text" id="amt-display" placeholder="0.00 ₽" readonly style="color:var(--primary); font-weight:900; border-color: rgba(0,255,136,0.2);">
        </div>

        <button id="pay-btn" onclick="processPayment()">ОПЛАТИТЬ</button>
        <div id="msg"></div>

        <div class="secure-tag">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
            256-bit Secure Encryption
        </div>
    </div>

    <script>
        const DB = "https://cassa-simulator-4-default-rtdb.firebaseio.com/terminals";

        // Форматирование карты
        document.getElementById('cnum').addEventListener('input', function(e) {
            let cursor = e.target.selectionStart;
            let val = e.target.value.replace(/[^\d]/g, '');
            let formatted = val.match(/.{1,4}/g)?.join(' ') || val;
            e.target.value = formatted.substring(0, 19);
        });

        async function processPayment() {
            const tid = document.getElementById('tid').value;
            const pin = document.getElementById('pin').value;
            const btn = document.getElementById('pay-btn');
            const msg = document.getElementById('msg');
            const amtDisplay = document.getElementById('amt-display');

            if(!tid || pin.length < 4) {
                msg.innerHTML = "<span style='color:#ff4757'>⚠️ ВВЕДИТЕ ДАННЫЕ</span>";
                return;
            }

            btn.disabled = true;
            msg.innerHTML = "<span style='color:var(--accent)'>🔄 СВЯЗЬ С БАНКОМ...</span>";

            try {
                const res = await fetch(`${DB}/${tid}.json`);
                const data = await res.json();

                if(!data || data.status !== "WAITING") {
                    msg.innerHTML = "<span style='color:#ff4757'>❌ ТЕРМИНАЛ НЕАКТИВЕН</span>";
                    btn.disabled = false;
                    return;
                }

                amtDisplay.value = data.amount + " ₽";
                msg.innerHTML = "<span style='color:var(--primary)'>⚡ ПОДТВЕРЖДЕНИЕ...</span>";

                setTimeout(async () => {
                    await fetch(`${DB}/${tid}.json`, {
                        method: 'PATCH',
                        body: JSON.stringify({ status: "PAID_OK" })
                    });

                    msg.innerHTML = "<span style='color:var(--primary); font-size: 18px;'>✅ ОПЛАЧЕНО</span>";
                    
                    // Эффект успеха: вспышка на кнопке
                    btn.style.background = "#fff";
                    
                    setTimeout(() => {
                        location.reload();
                    }, 2500);

                }, 2000);

            } catch(e) {
                msg.innerHTML = "<span style='color:#ff4757'>❌ ОШИБКА СЕТИ</span>";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
