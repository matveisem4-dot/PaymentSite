<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Банковский Терминал</title>
    <style>
        :root { --bg: #050508; --glass: rgba(255,255,255,0.05); --green: #00ff88; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; justify-content: center; align-items: center; margin: 0; }
        
        .card-box {
            width: 320px; padding: 30px; border-radius: 20px;
            background: var(--glass); border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(15px); text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        input {
            width: 100%; padding: 15px; margin-bottom: 15px;
            background: rgba(0,0,0,0.3); border: 1px solid #333;
            border-radius: 10px; color: white; font-size: 16px;
            text-align: center; box-sizing: border-box; outline: none;
        }
        input:focus { border-color: var(--green); }

        button {
            width: 100%; padding: 18px; border-radius: 10px; border: none;
            background: var(--green); color: #000; font-weight: 800; font-size: 16px;
            cursor: pointer; transition: 0.3s;
        }
        button:hover { transform: translateY(-3px); box-shadow: 0 0 20px rgba(0, 255, 136, 0.4); }
        button:disabled { background: #333; color: #555; transform: none; box-shadow: none; }

        #msg { margin-top: 15px; font-size: 14px; min-height: 20px; }
    </style>
</head>
<body>

    <div class="card-box">
        <h2 style="margin: 0 0 20px;">ОПЛАТА ЗАКАЗА</h2>
        
        <input type="number" id="tid" placeholder="Введите ID Кассы">
        <input type="text" id="cnum" placeholder="0000 0000 0000 0000" maxlength="19">
        
        <div style="display:flex; gap:10px">
            <input type="password" id="pin" placeholder="PIN" maxlength="4">
            <input type="text" id="amt-display" placeholder="Сумма" readonly style="color:var(--green); font-weight:bold">
        </div>

        <button id="pay-btn" onclick="processPayment()">ОПЛАТИТЬ</button>
        <div id="msg"></div>
    </div>

    <script>
        const DB = "https://cassa-simulator-4-default-rtdb.firebaseio.com/terminals";

        // Формат карты (пробелы)
        document.getElementById('cnum').addEventListener('input', function(e) {
            e.target.value = e.target.value.replace(/[^\d]/g, '').replace(/(.{4})/g, '$1 ').trim();
        });

        async function processPayment() {
            const tid = document.getElementById('tid').value;
            const pin = document.getElementById('pin').value;
            const btn = document.getElementById('pay-btn');
            const msg = document.getElementById('msg');
            const amtDisplay = document.getElementById('amt-display');

            if(!tid || pin.length < 4) {
                msg.innerText = "❌ Введите ID кассы и PIN код";
                return;
            }

            btn.disabled = true;
            msg.innerText = "🔄 Поиск терминала...";

            try {
                // 1. Проверяем, есть ли такой терминал и ждет ли он оплаты
                const res = await fetch(`${DB}/${tid}.json`);
                const data = await res.json();

                if(!data || data.status !== "WAITING") {
                    msg.innerText = "❌ Терминал не найден или не ждет оплату";
                    btn.disabled = false;
                    return;
                }

                // Показываем сумму
                amtDisplay.value = data.amount + " ₽";
                msg.innerText = "🔄 Обработка транзакции...";

                // Имитация задержки банка (2 секунды)
                setTimeout(async () => {
                    
                    // 2. Отправляем статус УСПЕХА
                    await fetch(`${DB}/${tid}.json`, {
                        method: 'PATCH',
                        body: JSON.stringify({ status: "PAID_OK" })
                    });

                    msg.innerHTML = "<b style='color:#00ff88'>✅ ОПЛАТА ПРОШЛА!</b>";
                    
                    setTimeout(() => {
                        location.reload(); // Перезагружаем страницу для нового клиента
                    }, 3000);

                }, 2000);

            } catch(e) {
                console.error(e);
                msg.innerText = "❌ Ошибка связи с сервером";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
