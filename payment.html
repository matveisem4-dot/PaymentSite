<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оплата заказа 2025</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .payment-card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 350px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 15px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; text-align: center; }
        button { width: 100%; padding: 12px; background-color: #00ff41; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.3s; }
        button:hover { background-color: #00cc33; }
        .status { margin-top: 15px; font-size: 14px; color: #666; }
    </style>
</head>
<body>

<div class="payment-card">
    <h2>Оплата по ID</h2>
    <p>Введите ID терминала, который вы видите на экране</p>
    
    <input type="number" id="terminal-id-input" placeholder="ID ТЕРМИНАЛА (6 цифр)">
    <input type="number" id="amount-input" placeholder="Сумма (например, 500)" value="500">
    
    <button onclick="sendPayment()">ОПЛАТИТЬ</button>
    
    <div id="status-msg" class="status"></div>
</div>

<script>
    // Та же база данных, что и в index.html
    const FIREBASE_BASE_URL = "https://cassa-simulator-4-default-rtdb.firebaseio.com";

    async function sendPayment() {
        const terminalId = document.getElementById('terminal-id-input').value;
        const amount = document.getElementById('amount-input').value;
        const statusMsg = document.getElementById('status-msg');

        if (terminalId.length < 5) {
            alert("Введите корректный ID терминала!");
            return;
        }

        statusMsg.innerText = "Отправка запроса...";

        try {
            // 1. Отправляем команду PAY (чтобы терминал показал QR, если он еще на главном экране)
            // В твоем index.html проверка идет по /commands/ID
            await fetch(`${FIREBASE_BASE_URL}/commands/${terminalId}.json`, {
                method: 'PUT',
                body: JSON.stringify({
                    command: "PAY",
                    amount: amount
                })
            });

            statusMsg.innerText = "Связь установлена. Подтверждаем оплату...";

            // 2. Имитируем небольшую задержку «обработки банком»
            setTimeout(async () => {
                // 3. Отправляем статус SUCCESS
                await fetch(`${FIREBASE_BASE_URL}/status/${terminalId}.json`, {
                    method: 'PUT',
                    body: JSON.stringify("SUCCESS")
                });

                statusMsg.style.color = "green";
                statusMsg.innerText = "Оплачено успешно! Проверьте терминал.";
            }, 2000);

        } catch (error) {
            console.error(error);
            statusMsg.style.color = "red";
            statusMsg.innerText = "Ошибка сети!";
        }
    }
</script>

</body>
</html>
