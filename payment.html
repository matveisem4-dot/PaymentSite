<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Omega Pay - Оплата</title>
    <style>
        body { background: #0a0a0f; color: white; font-family: sans-serif; padding: 20px; text-align: center; }
        .card { background: #16161e; padding: 20px; border-radius: 20px; border: 1px solid #333; }
        input { width: 100%; padding: 15px; margin: 10px 0; border-radius: 10px; border: 1px solid #333; background: #000; color: #00ff88; text-align: center; }
        button { width: 100%; padding: 15px; background: #00ff88; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Omega Pay</h2>
        <div id="price" style="font-size: 24px; margin-bottom: 15px;">Сумма: 0 ₽</div>
        <input type="text" id="c-num" placeholder="НОМЕР КАРТЫ">
        <input type="password" id="c-pin" placeholder="PIN" maxlength="4">
        <button id="btn" onclick="confirmPay()">ПОДТВЕРДИТЬ ОПЛАТУ</button>
        <p id="msg" style="color: red; margin-top: 10px;"></p>
    </div>

    <script>
        const DB = "https://cassa-simulator-4-default-rtdb.firebaseio.com";
        
        // Получаем ID терминала и Сумму из ссылки (URL)
        const params = new URLSearchParams(window.location.search);
        const termId = params.get('id');
        const amount = parseInt(params.get('amt'));

        if(amount) document.getElementById('price').innerText = `Сумма: ${amount} ₽`;

        async function confirmPay() {
            const num = document.getElementById('c-num').value.trim();
            const pin = document.getElementById('c-pin').value.trim();
            const msg = document.getElementById('msg');
            const btn = document.getElementById('btn');

            btn.disabled = true;
            btn.innerText = "ПРОВЕРКА...";

            try {
                // Ищем карту в твоей базе /cards/
                const res = await fetch(`${DB}/cards/${num}.json`);
                const card = await res.json();

                if (card && card.pin == pin) {
                    if (card.balance >= amount) {
                        // 1. Списываем деньги
                        await fetch(`${DB}/cards/${num}.json`, {
                            method: 'PATCH',
                            body: JSON.stringify({ balance: card.balance - amount })
                        });

                        // 2. ОТПРАВЛЯЕМ СИГНАЛ ТЕРМИНАЛУ СБЕРБАНКА
                        await fetch(`${DB}/status/${termId}.json`, {
                            method: 'PUT',
                            body: JSON.stringify({ state: "SUCCESS", method: "OmegaPay" })
                        });

                        btn.style.background = "gray";
                        btn.innerText = "ОПЛАЧЕНО ✅";
                        msg.style.color = "#00ff88";
                        msg.innerText = "Готово! Терминал обновлен.";
                    } else {
                        msg.innerText = "Недостаточно средств!";
                        btn.disabled = false;
                        btn.innerText = "ПОДТВЕРДИТЬ ОПЛАТУ";
                    }
                } else {
                    msg.innerText = "Карта не найдена или неверный ПИН!";
                    btn.disabled = false;
                    btn.innerText = "ПОДТВЕРДИТЬ ОПЛАТУ";
                }
            } catch (e) {
                alert("Ошибка сети!");
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
