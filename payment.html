<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Pay 2026 | Neo Edition</title>
    <style>
        :root {
            --primary: #00f2ff;
            --secondary: #7000ff;
            --bg: #050508;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --error: #ff3e3e;
            --success: #00ffa3;
        }

        body {
            background: var(--bg);
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(112, 0, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(0, 242, 255, 0.15) 0%, transparent 40%);
            color: white;
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; margin: 0; overflow: hidden;
        }

        /* Контейнер с уведомлениями */
        #notify-bar {
            position: absolute; top: 20px; padding: 12px 25px;
            border-radius: 10px; font-size: 14px; font-weight: 600;
            transform: translateY(-100px); transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000; backdrop-filter: blur(10px);
        }
        #notify-bar.show { transform: translateY(0); }
        .ntf-err { border: 1px solid var(--error); color: var(--error); background: rgba(255, 62, 62, 0.1); }
        .ntf-ok { border: 1px solid var(--success); color: var(--success); background: rgba(0, 255, 163, 0.1); }

        .payment-card {
            width: 380px; padding: 40px; border-radius: 30px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            position: relative; overflow: hidden;
        }

        .payment-card::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: conic-gradient(from 180deg at 50% 50%, transparent 0%, var(--primary) 25%, transparent 50%);
            animation: rotate 4s linear infinite; opacity: 0.1; z-index: -1;
        }

        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        h2 { text-align: center; margin: 0 0 10px; letter-spacing: 3px; font-weight: 800; }
        .system-status { text-align: center; font-size: 10px; color: #555; text-transform: uppercase; margin-bottom: 30px; }

        .input-box { margin-bottom: 25px; position: relative; }
        .input-box label { 
            display: block; font-size: 11px; color: var(--primary); 
            text-transform: uppercase; margin-bottom: 8px; letter-spacing: 1px; 
        }

        input {
            width: 100%; background: rgba(0,0,0,0.5); border: 1px solid var(--glass-border);
            padding: 15px; border-radius: 15px; color: white; font-size: 18px;
            font-family: 'Courier New', monospace; outline: none; transition: 0.3s;
            text-align: center; box-sizing: border-box;
        }
        input:focus { border-color: var(--primary); box-shadow: 0 0 15px rgba(0, 242, 255, 0.2); }

        /* Секция ПИН-кода */
        .pin-container {
            background: rgba(255,255,255,0.02); padding: 20px; border-radius: 20px;
            border: 1px solid var(--glass-border); margin-bottom: 30px;
        }

        button {
            width: 100%; padding: 20px; border: none; border-radius: 15px;
            background: linear-gradient(90deg, var(--secondary), var(--primary));
            color: white; font-size: 16px; font-weight: 800; cursor: pointer;
            text-transform: uppercase; letter-spacing: 2px; transition: 0.3s;
        }
        button:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(112, 0, 255, 0.3); }
        button:active { transform: scale(0.98); }
        button:disabled { background: #222; color: #444; cursor: not-allowed; transform: none; box-shadow: none; }

        /* Экран загрузки */
        #loader {
            position: absolute; inset: 0; background: var(--bg);
            display: none; flex-direction: column; justify-content: center; align-items: center;
            z-index: 100; border-radius: 30px;
        }
        .scan-line {
            width: 80%; height: 2px; background: var(--primary);
            box-shadow: 0 0 15px var(--primary);
            animation: scan 2s ease-in-out infinite;
        }
        @keyframes scan { 0%, 100% { transform: translateY(-50px); } 50% { transform: translateY(50px); } }
    </style>
</head>
<body>

    <div id="notify-bar"></div>

    <div class="payment-card">
        <div id="loader">
            <div class="scan-line"></div>
            <p style="margin-top: 20px; font-size: 12px; color: var(--primary); letter-spacing: 2px;">PROCESSING...</p>
        </div>

        <h2>CRYPTO-PAY</h2>
        <div class="system-status">Secure Transaction Node v4.0</div>

        <div class="input-box">
            <label>Terminal Connection ID</label>
            <input type="number" id="tid" placeholder="000000">
        </div>

        <div class="pin-container">
            <div class="input-box">
                <label>Card Number</label>
                <input type="text" id="card-num" placeholder="XXXX XXXX XXXX XXXX" maxlength="19">
            </div>
            <div class="input-box" style="margin-bottom: 0;">
                <label>PIN Code</label>
                <input type="password" id="pin" placeholder="****" maxlength="4" style="letter-spacing: 10px;">
            </div>
        </div>

        <div class="input-box">
            <label>Amount to Withdraw</label>
            <input type="number" id="amount" placeholder="0.00" style="color: var(--success); font-weight: bold;">
        </div>

        <button id="pay-btn" onclick="executePayment()">Authorize Payment</button>
    </div>

    <script>
        const DB_URL = "https://cassa-simulator-4-default-rtdb.firebaseio.com";

        function showStatus(text, isOk = false) {
            const bar = document.getElementById('notify-bar');
            bar.innerText = text;
            bar.className = isOk ? 'ntf-ok show' : 'ntf-err show';
            setTimeout(() => bar.classList.remove('show'), 3000);
        }

        // Форматирование номера карты
        document.getElementById('card-num').addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/[^\d]/g, '').replace(/(.{4})/g, '$1 ').trim();
        });

        async function executePayment() {
            const tid = document.getElementById('tid').value;
            const amt = document.getElementById('amount').value;
            const card = document.getElementById('card-num').value;
            const pin = document.getElementById('pin').value;
            const btn = document.getElementById('pay-btn');

            if (!tid || !amt || card.length < 19 || pin.length < 4) {
                showStatus("Error: Invalid credentials");
                return;
            }

            btn.disabled = true;

            try {
                const res = await fetch(`${DB_URL}/status/${tid}.json`);
                const data = await res.json();

                if (!data || data.state !== "WAITING_PAYMENT") {
                    showStatus("Terminal not found or not ready");
                    btn.disabled = false;
                    return;
                }

                // Включаем анимацию
                document.getElementById('loader').style.display = 'flex';

                setTimeout(async () => {
                    await fetch(`${DB_URL}/status/${tid}.json`, {
                        method: 'PATCH',
                        body: JSON.stringify({ state: "SUCCESS", lastUpdate: Date.now() })
                    });
                    
                    document.getElementById('loader').style.display = 'none';
                    showStatus("PAYMENT AUTHORIZED", true);
                    
                    setTimeout(() => location.reload(), 2500);
                }, 4000);

            } catch (e) {
                showStatus("Connection error");
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
