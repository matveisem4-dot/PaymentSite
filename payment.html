<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Оплата заказа 2025</title>
    <style>
        body { 
            font-family: sans-serif; 
            text-align: center; 
            padding-top: 20px; 
            background: linear-gradient(to bottom, #004d25, #008000, #4CAF50);
            color: white;
            min-height: 100vh;
        }
        .container { 
            max-width: 400px; 
            margin: auto; 
            border: 1px solid rgba(255, 255, 255, 0.2); 
            padding: 30px; 
            border-radius: 15px; 
            background: rgba(0, 0, 0, 0.4);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); 
        }
        .input-group { margin-bottom: 20px; text-align: left; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { 
            padding: 12px; font-size: 16px; width: 100%; box-sizing: border-box; 
            border: 1px solid #ddd; border-radius: 5px; background-color: black; 
            color: #00ff41; caret-color: #00ff41;
        }
        button { padding: 15px; font-size: 16px; border: none; cursor: pointer; width: 100%; font-weight: bold; border-radius: 5px; margin-top: 10px; transition: 0.3s; }
        .btn-pay { background-color: #00ff41; color: black; }
        .btn-pay:disabled { background-color: #555; cursor: not-allowed; }
        #status-text { margin-top: 15px; font-weight: bold; min-height: 1.2em; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Оплата заказа 2025</h1>
        
        <div class="input-group">
            <label for="terminal-id">ID ТЕРМИНАЛА (6 цифр):</label>
            <input type="number" id="terminal-id" placeholder="Напр: 123456">
        </div>

        <div class="input-group">
            <label for="payment-input">СУММА К ОПЛАТЕ (₽):</label>
            <input type="number" id="payment-input" placeholder="0.00" step="0.01">
        </div>
        
        <button id="pay-button" class="btn-pay" onclick="sendPaymentCommand()">ОТПРАВИТЬ НА ТЕРМИНАЛ</button>
        
        <p id="status-text">Система готова</p>
    </div>

    <script>
        const FIREBASE_BASE_URL = "https://cassa-simulator-4-default-rtdb.firebaseio.com";
        let checkStatusInterval = null;

        // Автозаполнение из URL
        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('id')) document.getElementById('terminal-id').value = urlParams.get('id');
            if (urlParams.get('amount')) document.getElementById('payment-input').value = urlParams.get('amount');
        };

        async function sendPaymentCommand() {
            const terminalId = document.getElementById('terminal-id').value;
            const amount = parseFloat(document.getElementById('payment-input').value);
            const statusText = document.getElementById('status-text');
            const btn = document.getElementById('pay-button');

            if (!terminalId || isNaN(amount) || amount <= 0) {
                updateStatus("Введите ID и сумму!", "red");
                return;
            }

            try {
                btn.disabled = true;
                updateStatus("Вызов терминала...", "orange");

                // 1. Отправляем команду PAY терминалу
                await fetch(`${FIREBASE_BASE_URL}/commands/${terminalId}.json`, {
                    method: 'PUT',
                    body: JSON.stringify({
                        command: "PAY",
                        amount: amount,
                        timestamp: Date.now()
                    })
                });

                updateStatus("Ожидание оплаты на терминале...", "yellow");

                // 2. Начинаем следить за статусом терминала
                if (checkStatusInterval) clearInterval(checkStatusInterval);
                
                checkStatusInterval = setInterval(() => {
                    checkTerminalStatus(terminalId);
                }, 2000);

            } catch (error) {
                btn.disabled = false;
                updateStatus("Ошибка сети: " + error.message, "red");
            }
        }

        async function checkTerminalStatus(terminalId) {
            const statusText = document.getElementById('status-text');
            const btn = document.getElementById('pay-button');

            try {
                const res = await fetch(`${FIREBASE_BASE_URL}/status/${terminalId}.json`);
                const data = await res.json();

                if (data && data.state === "SUCCESS") {
                    clearInterval(checkStatusInterval);
                    updateStatus("✅ ОПЛАЧЕНО УСПЕШНО!", "#00ff41");
                    btn.disabled = false;
                    
                    // Очистка команды после успеха (опционально, терминал сам удалит)
                    setTimeout(() => updateStatus("Система готова", "white"), 5000);
                }
            } catch (e) {
                console.error("Ошибка синхронизации");
            }
        }

        function updateStatus(text, color) {
            const st = document.getElementById('status-text');
            st.innerText = text;
            st.style.color = color;
        }
    </script>
</body>
</html>
