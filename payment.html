<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Банковский Процессинг 2026 | Secure Terminal</title>
    <style>
        :root {
            --accent: #00ff88;
            --bg: #0a0a0f;
            --card-bg: #161620;
            --text: #e0e0e0;
            --error: #ff4757;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Фоновое свечение */
        body::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: var(--accent);
            filter: blur(150px);
            opacity: 0.1;
            z-index: -1;
        }

        .container {
            width: 400px;
            background: var(--card-bg);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.05);
            position: relative;
            backdrop-filter: blur(10px);
        }

        h2 { margin: 0 0 10px; font-weight: 600; letter-spacing: 1px; color: white; }
        .subtitle { font-size: 13px; color: #777; margin-bottom: 25px; display: block; }

        /* Стили полей ввода */
        .input-group { text-align: left; margin-bottom: 15px; }
        .input-group label { display: block; font-size: 11px; color: var(--accent); text-transform: uppercase; margin-bottom: 5px; margin-left: 5px; }
        
        input {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid #2a2a35;
            background: #0d0d14;
            color: white;
            font-size: 16px;
            font-family: 'Courier New', monospace;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }
        input:focus { border-color: var(--accent); box-shadow: 0 0 15px rgba(0, 255, 136, 0.2); }
        input::placeholder { color: #444; }

        /* Визуальная карта */
        .card-form {
            background: linear-gradient(135deg, #1e1e2a 0%, #111118 100%);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.03);
        }

        .card-row { display: flex; gap: 10px; margin-top: 10px; }

        button {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 12px;
            background: var(--accent);
            color: #000;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        button:hover { filter: brightness(1.1); transform: translateY(-2px); }
        button:active { transform: scale(0.98); }

        /* Оверлей процессинга */
        #processing-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--card-bg);
            border-radius: 24px;
            z-index: 100;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .chip-anim {
            width: 50px; height: 40px;
            background: #ffd700;
            border-radius: 8px;
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
            background: linear-gradient(45deg, #d4af37, #f1c40f);
        }
        .chip-anim::after {
            content: ''; position: absolute; top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent);
            animation: shine 1.5s infinite;
        }
        @keyframes shine { to { left: 100%; } }

        .spinner {
            width: 50px; height: 50px;
            border: 3px solid rgba(0,255,136,0.1);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        #status-msg { margin-top: 20px; font-size: 13px; color: var(--accent); letter-spacing: 2px; }
        #error-log { color: var(--error); font-size: 13px; margin-top: 15px; min-height: 1.5em; }

    </style>
</head>
<body>

    <div class="container">
        <div id="main-ui">
            <h2>PAYMENT GATEWAY</h2>
            <span class="subtitle">Secure Cloud Processing v4.0</span>
            
            <div class="input-group">
                <label>Terminal ID</label>
                <input type="number" id="tid" placeholder="000000">
            </div>

            <div class="card-form">
                <div class="input-group">
                    <label>Card Number</label>
                    <input type="text" id="card-num" placeholder="0000 0000 0000 0000" maxlength="19">
                </div>
                <div class="card-row">
                    <div class="input-group" style="flex: 2;">
                        <label>Expiry Date</label>
                        <input type="text" id="card-date" placeholder="MM/YY" maxlength="5">
                    </div>
                    <div class="input-group" style="flex: 1;">
                        <label>CVV</label>
                        <input type="password" id="card-cvv" placeholder="***" maxlength="3">
                    </div>
                </div>
            </div>

            <div class="input-group">
                <label>Total Amount (RUB)</label>
                <input type="number" id="user-sum" placeholder="0.00">
            </div>
            
            <button id="pay-btn" onclick="startPayment()">PROCEED TO PAY</button>
            <p id="error-log"></p>
        </div>

        <div id="processing-overlay">
            <div class="chip-anim"></div>
            <div class="spinner"></div>
            <div id="status-msg">CONNECTING...</div>
        </div>
    </div>

    <script>
        const FIREBASE_BASE_URL = "https://cassa-simulator-4-default-rtdb.firebaseio.com";

        // --- МАСКИ ВВОДА ДАННЫХ ---
        document.getElementById('card-num').addEventListener('input', function (e) {
            e.target.value = e.target.value.replace(/[^\d]/g, '').replace(/(.{4})/g, '$1 ').trim();
        });

        document.getElementById('card-date').addEventListener('input', function (e) {
            let val = e.target.value.replace(/[^\d]/g, '');
            if (val.length >= 3) {
                e.target.value = val.slice(0, 2) + '/' + val.slice(2, 4);
            } else {
                e.target.value = val;
            }
        });

        // --- ЛОГИКА ОПЛАТЫ ---
        async function startPayment() {
            const tid = document.getElementById('tid').value;
            const userSum = document.getElementById('user-sum').value;
            const cardNum = document.getElementById('card-num').value;
            const errorLog = document.getElementById('error-log');
            const overlay = document.getElementById('processing-overlay');
            const statusMsg = document.getElementById('status-msg');

            if (!tid || !userSum || cardNum.length < 16) {
                errorLog.innerText = "⚠️ Check Terminal ID and Card Data";
                return;
            }

            errorLog.innerText = "Verifying Terminal...";
            
            try {
                const response = await fetch(`${FIREBASE_BASE_URL}/status/${tid}.json`);
                const terminalData = await response.json();

                if (!terminalData) {
                    errorLog.innerText = "❌ Terminal not found";
                    return;
                }

                if (terminalData.state !== "WAITING_PAYMENT") {
                    errorLog.innerText = "❌ Terminal is not ready";
                    return;
                }

                // Симуляция процесса
                errorLog.innerText = "";
                overlay.style.display = 'flex';

                setTimeout(() => { statusMsg.innerText = "ENCRYPTING DATA..."; }, 1000);
                setTimeout(() => { statusMsg.innerText = "AUTHORIZING..."; }, 2500);
                setTimeout(() => { statusMsg.innerText = "BANK RESPONSE: OK"; }, 3800);

                // Завершение
                setTimeout(async () => {
                    try {
                        await fetch(`${FIREBASE_BASE_URL}/status/${tid}.json`, {
                            method: 'PATCH',
                            body: JSON.stringify({ 
                                state: "SUCCESS", 
                                lastUpdate: Date.now() 
                            })
                        });

                        statusMsg.innerText = "✅ TRANSACTION COMPLETE";
                        statusMsg.style.color = "#00ff88";
                        
                        setTimeout(() => { location.reload(); }, 2500);

                    } catch (err) {
                        statusMsg.innerText = "DB WRITE ERROR";
                    }
                }, 4500);

            } catch (e) {
                errorLog.innerText = "❌ Connection Failed";
            }
        }
    </script>
</body>
</html>
