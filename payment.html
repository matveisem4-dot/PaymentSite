<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Оплата заказа</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; }
        .container { max-width: 400px; margin: auto; border: 1px solid #ccc; padding: 20px; border-radius: 10px; }
        input { padding: 10px; font-size: 16px; width: 80%; margin-bottom: 20px; }
        button { padding: 10px 20px; font-size: 18px; background-color: #4CAF50; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #45a049; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Оплата заказа</h1>
        <p>Введите сумму для оплаты:</p>
        <input type="number" id="payment-input" value="0.00" step="0.01">
        <button onclick="handlePaymentClick()">Оплатить</button>
    </div>

    <script>
        const FIREBASE_BASE_URL = "https://cassa-simulator-4-default-rtdb.firebaseio.com";
        
        // Получаем ID терминала из URL-параметра
        const urlParams = new URLSearchParams(window.location.search);
        const TERMINAL_ID = urlParams.get('id');

        if (!TERMINAL_ID) {
            alert("Ошибка: Неверный ID терминала в ссылке.");
        }

        // Логика обработки нажатия кнопки "Оплатить"
        async function handlePaymentClick() {
            const userEntered = parseFloat(document.getElementById('payment-input').value); 
            
            // Получаем требуемую сумму из Firebase, которую оставил терминал
            const response = await fetch(`${FIREBASE_BASE_URL}/status/${TERMINAL_ID}.json`);
            const data = await response.json();
            
            // Если данные невалидны, значит терминал уже закрыл сессию
            if (!data || !data.requiredAmount) {
                alert("Ошибка: Сессия оплаты закрыта.");
                return;
            }
            
            const requiredAmount = parseFloat(data.requiredAmount);

            if (userEntered < requiredAmount) {
                // ЕСЛИ СУММА МЕНЬШЕ
                alert("ОШИБКА: Недостаточно средств. Нужно минимум " + requiredAmount + " руб.");
            } else {
                // ЕСЛИ СУММА РОВНО ИЛИ БОЛЬШЕ
                await fetch(`${FIREBASE_BASE_URL}/status/${TERMINAL_ID}.json`, {
                    method: 'PUT',
                    body: JSON.stringify({ state: "SUCCESS" }) // Отправляем сигнал об успехе
                });
                alert("Оплата прошла успешно! Можно закрывать это окно.");
            }
        }
    </script>
</body>
</html>
