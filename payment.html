<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Payment Gateway</title>
    <style>
        :root {
            --accent: #00ff88;
            --accent-glow: rgba(0, 255, 136, 0.3);
            --bg: #0d0e12;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text: #ffffff;
        }

        body {
            background: var(--bg);
            background-image: radial-gradient(circle at 50% -20%, #1a2a22 0%, var(--bg) 80%);
            color: var(--text);
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; margin: 0;
        }

        /* Плавные уведомления */
        #status-msg {
            position: fixed; top: 40px; padding: 12px 25px;
            border-radius: 12px; font-weight: 600; font-size: 14px;
            opacity: 0; transform: translateY(-20px);
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(10px); z-index: 1000;
        }
        #status-msg.active { opacity: 1; transform: translateY(0); }
        .error { border: 1px solid #ff4757; color: #ff4757; background: rgba(255, 71, 87, 0.1); }
        .success { border: 1px solid var(--accent); color: var(--accent); background: rgba(0, 255, 136, 0.1); }

        .payment-container {
            width: 400px; padding: 40px; border-radius: 32px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(20px);
            box-shadow: 0 40px 100px rgba(0,0,0,0.6);
            text-align: center;
        }

        h1 { font-size: 1.6rem; margin: 0; letter-spacing: 1px; font-weight: 800; }
        .subtitle { color: #555; font-size: 11px; margin-bottom: 35px; text-transform: uppercase; letter-spacing: 2px; }

        .input-group { text-align: left; margin-bottom: 22px; }
        label { display: block; font-size: 10px; color: var(--accent); margin-bottom: 8px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }

        input {
            width: 100%; background: rgba(0,0,0,0.4); border: 1px solid var(--glass-border);
            padding: 16px; border-radius: 16px; color: white; font-size: 18px;
            font-family: 'Consolas', monospace; outline: none; transition: 0.3s;
            box-sizing: border-box;
        }
        input:focus { border-color: var(--accent); background: rgba(0,0,0,0.6); box-shadow: 0 0 20px var(--accent-glow); }
        input::placeholder { color: #333; }

        .card-box {
            background: rgba(255,255,255,0.02); padding: 25px; border-radius: 24px;
            border: 1px solid var(--glass-border); margin-bottom: 25px;
        }

        .flex-row { display: flex; gap: 15px; }

        button {
            width: 100%; padding: 20px; border: none; border-radius: 18px;
            background: var(--accent); color: #000; font-size: 16px;
            font-weight: 800; cursor: pointer; text-transform: uppercase;
            letter-spacing: 1px; transition: 0.3s;
            box-shadow: 0 10px 30px var(--accent-glow);
        }
        button:hover { transform: translateY(-3px); filter: brightness(1.1); box-shadow: 0 15px 40px var(--accent-glow); }
        button:active { transform: scale(0.97); }
        button:disabled { background: #222; color: #444; box-shadow: none; cursor: not-allowed; }

        /* Анимация загрузки */
        .loader-dots { display: none; gap: 8px; justify-content: center; margin-top: 15px; }
        .dot { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; animation: bounce 1.4s infinite ease-in-out; }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
    </style>
</head>
<body>

    <div id="status-msg"></div>

    <div class="payment-container">
        <h1>GATEWAY PRO</h1>
        <div class="subtitle">Secure Digital Processing</div>

        <div class="input-group">
            <label>Terminal ID</label>
            <input type="number" id="tid" placeholder="000000">
        </div>

        <div class="card-box">
            <div class="input-group">
                <label>Card Number</label>
                <input type="text" id="c-num" placeholder="0000 0000 0000 0000" maxlength="19">
            </div>
            
            <div class="flex-row">
                <div class="input-group" style="flex: 1;">
                    <label>PIN Code</label>
                    <input type="password" id="pin" placeholder="****" maxlength="4" style="text-align: center; letter-spacing: 8px;">
                </div>
                <div class="input-group" style="flex: 1.5;">
                    <label>Amount (RUB)</label>
                    <input type="number" id="amt" placeholder="0.00" style="color: var(--accent); font-weight: bold;">
                </div>
            </div>
        </div>

        <button id="pay-btn" onclick="startPayment()">Confirm & Pay</button>
        
        <div class="loader-dots" id="loader">
            <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>
    </div>

    <script>
        const FIREBASE_URL = "https://cassa-simulator-4-default-rtdb.firebaseio.com";

        function notify(text, isSuccess) {
            const msg = document.getElementById('status-msg');
            msg.innerText = text;
            msg.className = isSuccess ? 'success active' : 'error active';
            setTimeout(() => msg.classList.remove('active'), 3000);
        }

        // Авто-пробелы для карты
        document.getElementById('c-num').addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/[^\d]/g, '').replace(/(.{4})/g, '$1 ').trim();
        });

        async function startPayment() {
            const tid = document.getElementById('tid').value;
            const amt = document.getElementById('amt').value;
            const card = document.getElementById('c-num').value;
            const pin = document.getElementById('pin').value;
            const btn = document.getElementById('pay-btn');
            const loader = document.getElementById('loader');

            if (!tid || !amt || card.length < 19 || pin.length < 4) {
                notify("Ошибка: Заполните все данные", false);
                return;
            }

            btn.disabled = true;
            loader.style.display = 'flex';

            try {
                const res = await fetch(`${FIREBASE_URL}/status/${tid}.json`);
                const data = await res.json();

                if (!data || data.state !== "WAITING_PAYMENT") {
                    notify("Терминал не найден или не готов", false);
                    btn.disabled = false;
                    loader.style.display = 'none';
                    return;
                }

                // Имитация банковского процессинга
                setTimeout(async () => {
                    await fetch(`${FIREBASE_URL}/status/${tid}.json`, {
                        method: 'PATCH',
                        body: JSON.stringify({ state: "SUCCESS", lastUpdate: Date.now() })
                    });
                    
                    loader.style.display = 'none';
                    notify("ОПЛАТА ВЫПОЛНЕНА УСПЕШНО", true);
                    setTimeout(() => location.reload(), 2500);
                }, 3500);

            } catch (e) {
                notify("Ошибка связи с банком", false);
                btn.disabled = false;
                loader.style.display = 'none';
            }
        }
    </script>
</body>
</html>
