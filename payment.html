<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Панель управления оплатой</title>
    <style>
        body { 
            font-family: sans-serif; 
            text-align: center; 
            padding-top: 20px; 
            background: linear-gradient(to bottom, #004d25, #008000, #4CAF50);
            color: white;
            min-height: 100vh;
            margin: 0;
        }
        .container { 
            max-width: 400px; 
            margin: auto; 
            border: 1px solid rgba(255, 255, 255, 0.2); 
            padding: 30px; 
            border-radius: 15px; 
            background: rgba(0, 0, 0, 0.6);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
        }
        .input-group { margin-bottom: 20px; text-align: left; }
        label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 14px; }
        
        input { 
            padding: 15px; font-size: 18px; width: 100%; box-sizing: border-box; 
            border: 2px solid #00ff41; border-radius: 8px; background-color: #111; 
            color: #00ff41; font-weight: bold; outline: none;
        }
        
        /* Кнопка отправки сигнала успеха */
        .btn-success { 
            padding: 20px; font-size: 18px; border: none; cursor: pointer; 
            width: 100%; font-weight: bold; border-radius: 8px; 
            margin-top: 20px; transition: 0.3s;
            background-color: #00ff41; color: black;
            text-transform: uppercase;
        }
        .btn-success:hover { background-color: #00cc33; transform: scale(1.02); }
        .btn-success:active { transform: scale(0.98); }
        
        #status-text { 
            margin-top: 20px; padding: 10px; border-radius: 5px;
            font-weight: bold; background: rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="font-size: 24px;">Админ-панель Кассы</h1>
        <p style="opacity: 0.8; font-size: 13px;">Отправка сигнала "Успешно" на терминал</p>
        
        <div class="input-group">
            <label for="terminal-id">ID ТЕРМИНАЛА:</label>
            <input type="number" id="terminal-id" placeholder="Введите ID" value="123456">
        </div>

        <button class="btn-success" onclick="forceSuccessOnTerminal()">✅ ПОДТВЕРДИТЬ ОПЛАТУ</button>
        
        <div id="status-text">Ожидание действий...</div>
    </div>

    <script>
        const FIREBASE_BASE_URL = "https://cassa-simulator-4-default-rtdb.firebaseio.com";

        // Если в ссылке есть ID, подставляем его автоматически
        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            if (id) document.getElementById('terminal-id').value = id;
        };

        async function forceSuccessOnTerminal() {
            const terminalId = document.getElementById('terminal-id').value;
            const statusText = document.getElementById('status-text');

            if (!terminalId) {
                statusText.style.color = "#ff4444";
                statusText.innerText = "ОШИБКА: Введите ID терминала";
                return;
            }

            statusText.style.color = "yellow";
            statusText.innerText = "Отправка сигнала на терминал " + terminalId + "...";

            try {
                // ГЛАВНОЕ ДЕЙСТВИЕ: Мы принудительно меняем статус терминала на SUCCESS
                // Терминал (твой второй код) увидит это изменение и покажет галочку
                const response = await fetch(`${FIREBASE_BASE_URL}/status/${terminalId}.json`, {
                    method: 'PATCH', // Используем PATCH, чтобы обновить только статус
                    body: JSON.stringify({ 
                        state: "SUCCESS",
                        lastUpdate: Date.now(),
                        externalConfirmation: true // Пометка, что подтверждено из админки
                    })
                });

                if (response.ok) {
                    statusText.style.color = "#00ff41";
                    statusText.innerText = "СИГНАЛ ОТПРАВЛЕН! Терминал должен показать успех.";
                    
                    // Через 3 секунды сбрасываем текст статуса
                    setTimeout(() => {
                        statusText.style.color = "white";
                        statusText.innerText = "Ожидание действий...";
                    }, 3000);
                } else {
                    throw new Error("Ошибка сервера Firebase");
                }

            } catch (error) {
                statusText.style.color = "#ff4444";
                statusText.innerText = "ОШИБКА СВЯЗИ: " + error.message;
            }
        }
    </script>
</body>
</html>
